## 📌 부록 — 핵심 암기 요약

| 구분 | 암기 포인트 |
|---|---|
| **요구사항 검증 방법 3가지** | **동료 검토**(작성자가 설명) · **워크스루**(사전 배포 후 회의) · **인스펙션**(작성자 제외 전문가) |
| **베이스라인** | 검토·합의되어 **변경을 통제해야 할 시점의 기준**이 되는 산출물 |
| **인터페이스 표준 항목 2가지** | **시스템 공통부** · **거래 공통부** |
| **인터페이스 통신 유형 3가지** | 단방향 · **동기**(응답 대기) · **비동기**(응답 대기 안 함) |
| **인터페이스 처리 유형 3가지** | 실시간 · 지연 처리 · 배치 |
| **미들웨어 종류 6가지** | DB · **RPC**(원격 프로시저) · **MOM**(비동기 메시지) · **TP-Monitor**(예약 업무) · **ORB**(CORBA, 객체) · **WAS**(동적 콘텐츠) |
| **인터페이스 구현 방법 2가지** | **데이터 통신**(JSON/XML 파싱) · **인터페이스 엔티티**(테이블 이용) |
| **JSON** | 속성-값 쌍. **AJAX** 에서 XML 을 대체. XML 보다 가볍고 빠름 |
| **인터페이스 계층별 보안** | 네트워크(**IPSec·SSL/TLS·S-HTTP**) · 애플리케이션(보안 가이드) · DB(암호화) |
| **DB 암호화 기법 4가지** | **API**(애플리케이션 레벨) · **Plug-In**(DB 레벨) · **TDE**(투명 데이터 암호화, DB 엔진이 직접) · **Hybrid**(API+Plug-In) |
| **인터페이스 구현 검증 도구 6가지** | **xUnit** · **STAF** · **FitNesse**(웹 기반) · **NTAF**(FitNesse+STAF, NHN) · **Selenium**(웹) · watir(Ruby) |
| **인터페이스 감시 도구 — APM** | **APM** — 스카우터(Scouter) · 제니퍼(Jennifer) |
