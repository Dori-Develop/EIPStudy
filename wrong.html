<!doctype html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="description" content="틀린 문제를 모아 다시 풀기 — 정보처리기사 실기 학습 사이트">
<title>오답노트 · EIP Study</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📘</text></svg>">
<link rel="stylesheet" href="assets/style.css">
<script>
/* 첫 페인트 전에 테마를 적용해 깜빡임 방지 */
(function(){try{var t=JSON.parse(localStorage.getItem('eip.theme'));
if(!t)t=matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';
document.documentElement.setAttribute('data-theme',t);}catch(e){}})();
</script>
</head>
<body>

<header class="hdr">
  <div class="hdr__title" style="padding-left:8px">
    <a href="index.html" class="js-back">← 홈</a>
    <small class="js-where">오답노트</small>
  </div>
  <span class="hdr__brand">정보처리기사 실기</span>
  <button type="button" class="iconbtn js-theme" aria-label="테마 전환">🌙</button>
</header>

<div class="layout">
  <main class="main">
    <div class="wrap">

      <section class="hero">
        <h1>오답노트</h1>
        <p>
          틀린 문제는 자동으로 모입니다. 다시 풀어 맞히면 분류가 저절로 옮겨 갑니다.
          분류가 마음에 들지 않으면 직접 옮길 수도 있습니다.
        </p>
      </section>

      <div id="wrong"></div>

      <footer class="footer">
        <p>
          기록은 이 브라우저에만 저장됩니다.
        </p>
        <nav class="toolnav js-toolnav" aria-label="다른 학습 도구"></nav>
      </footer>

    </div>
  </main>
</div>

<script src="assets/app.js"></script>
<script src="assets/toc.js"></script>
<script src="assets/wrongstore.js"></script>
<script src="assets/qcard.js"></script>
<script src="assets/wrong.js"></script>
</body>
</html>
