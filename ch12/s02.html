## (2) 릴리즈 노트 작성

### 릴리즈 노트(Release Note) ⭐

개발 과정에서 정리된 **릴리즈 정보를 고객과 공유하기 위한 문서**.

- 테스트 진행 방법에 대한 결과와 **소프트웨어 사양에 대한 개발팀의 정확한 준수 여부**를 확인할 수 있음.
- 전체 시험 과정을 **소프트웨어 개발팀에서 직접 확인**할 수 있음.
- 사용자에게 **최종 배포된 릴리즈 정보를 제공**.

### 릴리즈 노트 초기 버전 작성 시 고려사항 ⭐

| 고려사항 | 내용 |
|---|---|
| **모듈 식별** | 모듈별 **빌드 수행 후 릴리즈 노트에 작성될 내용** 확인 |
| **릴리즈 정보 확인** | 문서 이름, 제품 이름, 버전 번호, 릴리즈 날짜, 참고 날짜, 노트 버전 등을 확인 |
| **릴리즈 노트 개요 작성** | 소프트웨어 및 변경 사항 전체에 대한 **간략한 내용** 작성 |
| **영향도 체크** | 버그나 이슈 관련 내용, 다른 소프트웨어에 미치는 **영향**에 대한 기술 |
| **정식 릴리즈 노트 작성** | 항목별 내용을 정리해 정식 릴리즈 노트를 작성 |
| **추가 개선 항목 식별** | **추가 개선 사항**을 식별해 릴리즈 노트에 기술 |

### 릴리즈 노트 작성 항목 ⭐⭐

| 항목 | 내용 |
|---|---|
| **Header**(머릿말) | **문서 이름, 소프트웨어 이름, 릴리즈 버전, 릴리즈 날짜, 노트 날짜, 노트 버전** 등 |
| **개요** | 소프트웨어 및 변경 사항 전체에 대한 간략한 **내용** |
| **목적** | 릴리즈 버전의 **새로운 기능 목록**과 릴리즈 노트의 목적에 대한 **간략한 개요**, **버그 수정 사항** 간략 언급 |
| **문제 요약** | **수정된 버그**에 대한 간략한 설명 또는 릴리즈 추가 항목에 대한 요약 |
| **재현 항목** | 버그 발견에 대한 **과정**을 서술 |
| **수정 / 개선 내용** | 버그를 수정 / 개선한 **내용**을 간단히 서술 |
| **사용자 영향도** | 사용자가 다른 기능들을 사용하는 데 있어 **미칠 수 있는 영향**에 대한 설명 |
| **SW 지원 영향도** | 이번 릴리즈 버전에서의 **기능 변화가 다른 응용 프로그램에 미칠 수 있는 영향**에 대한 설명 |
| **노트** | 소프트웨어 및 하드웨어 **설치 항목**, 제품·문서를 포함한 **업그레이드 항목 메모** |
| **면책 조항** | 회사 및 표준 제품과 관련된 **메시지**. 프리웨어, 불법 복제 금지 등 |
| **연락처** | 사용자 지원 및 문의 응대를 위한 **연락처** 정보 |

### 릴리즈 노트 작성 순서

```mermaid
flowchart LR
    A[모듈 식별] --> B[릴리즈 정보 확인] --> C[릴리즈 노트 개요 작성] --> D[영향도 체크] --> E[정식 릴리즈 노트 작성] --> F[추가 개선 항목 식별]
```

> 💡 **추가 개선 항목 식별 시 릴리즈 노트를 추가로 작성**해야 하는 경우
> - **베타 버전**이 출시되거나 **긴급한 버그 수정**이 있을 때
> - **사용자 요청에 따른 특이 사항**이 있을 때
