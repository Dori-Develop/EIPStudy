## (8) Git 명령어 활용

### Git 의 저장소 구조 ⭐⭐

```mermaid
flowchart LR
    W["작업 트리<br/>(Working Tree)"] -->|"git add"| S["스테이지<br/>(Staging Area)"]
    S -->|"git commit"| L["지역 저장소<br/>(Local Repository)"]
    L -->|"git push"| R["원격 저장소<br/>(Remote Repository)"]
    R -->|"git pull / fetch"| L
    L -->|"git checkout"| W
```

| 영역 | 의미 |
|---|---|
| **작업 트리**(Working Tree) | 실제로 **파일을 수정하는 작업 공간** |
| **스테이지**(Staging Area, Index) | 커밋할 파일을 **임시로 올려 두는 공간** |
| **지역 저장소**(Local Repository) | 커밋된 내역이 **자신의 PC 에 저장**되는 공간 |
| **원격 저장소**(Remote Repository) | 여러 사람이 공유하는 **서버상의 저장소** |

### Git 의 주요 명령어 ⭐⭐⭐

| 명령어 | 기능 |
|---|---|
| **`git init`** | 지역 저장소를 **생성(초기화)** |
| **`git clone`** | 원격 저장소의 전체 내용을 **지역 저장소로 복제** |
| **`git add`** | 작업 내역을 **스테이지에 추가** |
| **`git commit`** | 스테이지에 있는 파일들을 **지역 저장소에 저장** |
| **`git push`** | 지역 저장소의 변경 내역을 **원격 저장소에 반영** |
| **`git fetch`** | 원격 저장소의 변경 이력만 **지역 저장소로 가져옴** |
| **`git pull`** | 원격 저장소의 변경 내역을 **지역 저장소로 가져와 병합**(fetch + merge) |
| **`git branch`** | **브랜치를 생성하거나 조회** |
| **`git checkout`** | 지정한 **브랜치로 이동** |
| **`git merge`** | 지정한 브랜치의 변경 내역을 **현재 브랜치에 병합** |
| **`git status`** | 작업 트리와 스테이지의 **현재 상태를 확인** |
| **`git log`** | **커밋 이력을 조회** |
| **`git diff`** | 파일의 **변경 내용을 비교** |
| **`git reset`** | 특정 커밋 상태로 **되돌림** |
| **`git remote add`** | **원격 저장소를 연결** |

> ⚠️ **fetch vs pull** — `fetch` 는 **가져오기만**, `pull` 은 **가져와서 병합까지**.
> ⚠️ **커밋은 지역 저장소에, 푸시로 원격 저장소에 반영**됨. 이 구분이 자주 나옴.

### Git 의 브랜치(Branch)

- 독립적으로 작업을 진행하기 위한 **작업 흐름의 분기**
- 기본 브랜치는 보통 **main**(과거에는 master)
- 브랜치를 만들어 작업한 후 **merge** 로 합침
