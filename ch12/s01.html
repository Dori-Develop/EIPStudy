## (1) 소프트웨어 패키징

### 소프트웨어 패키징 ⭐

모듈별로 생성한 실행 파일들을 묶어 **배포용 설치 파일을 만드는 것**.

- ⚠️ **개발자가 아니라 사용자 중심**으로 진행.
- 소스 코드는 향후 **관리를 고려해 모듈화**하여 패키징.
- 사용자가 소프트웨어를 **직접 배포받아 설치할 것**을 전제로,
  **사용자의 편의성 및 설치 파일의 형태**를 확인해 패키징을 진행.

### 패키징 시 고려사항 ⭐⭐

| 고려사항 | 내용 |
|---|---|
| **사용자 시스템 환경** | 사용자의 **운영체제, CPU, 메모리** 등에 필요한 최소 환경을 정의함 |
| **UI 제공** | 직관적인 UI 를 제공하고, **매뉴얼과 일치**시켜 패키징 작업을 수행함 |
| **관리 서비스 형태 제공** | 하드웨어와 함께 관리될 수 있도록 **내부 콘텐츠에 대한 상세 정보**를 제공함 |
| **다양한 배포 형태** | 다양한 사용자 요구사항을 반영하기 위해 **배포 형태를 다양하게** 제공함 |

### 패키징 작업 순서 ⭐

```mermaid
flowchart LR
    A[기능 식별] --> B[모듈화] --> C[빌드 진행] --> D[사용자 환경 분석] --> E[패키징 및 적용 시험] --> F[패키징 변경 개선] --> G[배포]
```

| 단계 | 내용 |
|---|---|
| **기능 식별** | 작성된 코드의 **기능을 확인** |
| **모듈화** | 확인된 기능 단위로 **코드를 분류** |
| **빌드 진행** | 모듈 단위별로 **실행 파일을 만듦** |
| **사용자 환경 분석** | 웹, 모바일, PC 등 **소프트웨어가 사용될 환경이나 운영체제, CPU, RAM 등의 최소 운영 환경**을 정의 |
| **패키징 및 적용 시험** | 빌드된 실행 파일들을 **정의된 환경에 맞게 배포용 파일 형식으로 패키징**하고, 사용자 환경과 같은 환경에서 **패키징 적용을 시험**함 |
| **패키징 변경 개선** | 확인된 불편 사항을 반영하기 위한 **패키징의 변경 및 개선**을 진행 |
| **배포** | 배포 수행 시 **오류가 발생하면 해당 개발자에게 전달**해 수정을 요청 |
