## (7) 소프트웨어 버전 관리 도구

### 버전 관리 도구의 분류 ★★★

| 방식 | 설명 | 도구 |
|---|---|---|
| **공유 폴더 방식** | 버전 관리 자료가 **로컬 컴퓨터의 공유 폴더에 저장**되어 관리되는 방식.<br>담당자 한 명이 매일 파일의 이상 유무를 확인함 | **SCCS, RCS, PVCS, QVCS** |
| **클라이언트/서버 방식** | 버전 관리 자료가 **중앙 시스템(서버)에 저장**되어 관리되는 방식.<br>모든 버전 관리는 서버에서 수행됨. **서버에 문제가 생기면 협업 불가** | **CVS, SVN(Subversion), CVSNT, Clear Case, CMVC, Perforce** |
| **분산 저장소 방식** | 버전 관리 자료가 **하나의 원격 저장소와 분산된 개발자 PC 의 로컬 저장소에 함께 저장**되어 관리되는 방식.<br>개발자별로 원격 저장소의 자료를 **자신의 로컬 저장소로 복제(Clone)** 해 작업한 후 반영함 | **Git, GNU arch, DCVS, Bazaar, Mercurial, TeamWare, Bitkeeper, Plastic SCM** |

> ⚠️ **SVN = 클라이언트/서버**, **Git = 분산 저장소**. 이 구분이 매번 나옴.

### 주요 버전 관리 도구 ★★

| 도구 | 특징 |
|---|---|
| **CVS**(Concurrent Version System) | **가장 오래된** 버전 관리 도구 중 하나로 **중앙 집중형** 서버 저장소를 두고 클라이언트가 접속해 버전 관리를 수행.<br>⚠️ 다양한 OS 를 지원하지만 **파일의 이름이나 디렉터리 변경, 심볼릭 링크는 지원하지 않음** |
| **SVN**(Subversion) | **CVS 를 개선**한 것으로, 아파치 소프트웨어 재단에서 발표.<br>**하나의 서버에서 소스를 관리**하며, 소스가 오픈되어 있어 무료로 사용 가능.<br>**디렉터리, 파일을 자유롭게 이동**해도 버전 관리가 가능함 |
| **Git** | **리누스 토발즈**가 리눅스 커널 개발을 위해 개발. 이후 **주니오 하마노**에 의해 유지 보수됨.<br>**분산형 버전 관리 시스템**으로, **지역(로컬) 저장소와 원격 저장소**가 존재.<br>버전 관리가 지역 저장소에서 진행되므로 **속도가 빠름**.<br>**커밋(Commit) 은 지역 저장소에서 수행**되고, **푸시(Push) 라는 동작으로 원격 저장소에 반영**됨 |

**SVN 의 주요 명령어**

| 명령어 | 기능 |
|---|---|
| `add` | 새로운 파일이나 디렉터리를 **버전 관리 대상으로 등록** |
| `commit` | 변경된 파일을 **서버에 반영** |
| `update` | 서버의 최신 커밋 이력을 **로컬로 가져옴** |
| `checkout` | 저장소에서 **소스 파일을 받아옴** |
| `import` | 아무것도 없는 저장소에 **파일을 처음 등록** |
| `merge` | 다른 디렉터리에서 작업된 버전 관리 내역을 **기본 개발 작업과 병합** |
