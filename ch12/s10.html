## 📌 부록 — 핵심 암기 요약

| 구분 | 암기 포인트 |
|---|---|
| **패키징 원칙** | **개발자가 아니라 사용자 중심**으로 진행 |
| **패키징 고려사항** | 사용자 시스템 환경 · UI 제공 · 관리 서비스 형태 · 다양한 배포 형태 |
| **패키징 순서** | 기능 식별 → 모듈화 → 빌드 → 사용자 환경 분석 → 패키징·적용 시험 → 변경 개선 → 배포 |
| **릴리즈 노트 Header** | 문서 이름 · 소프트웨어 이름 · **릴리즈 버전 · 릴리즈 날짜** · 노트 날짜 · 노트 버전 |
| **DRM 구성 요소** | **클리어링 하우스(라이선스·결제)** · 콘텐츠 제공자 · **패키저(암호화)** · 콘텐츠 분배자 · 소비자 · **DRM 컨트롤러** · 보안 컨테이너 |
| **DRM 기술 요소** | 암호화 · 키 관리 · 암호화 파일 생성 · 식별 · 저작권 표현 · 정책 관리 · **크랙 방지** · 인증 |
| **설치/사용자 매뉴얼** | 둘 다 **목차 및 개요 · 서문 · 기본 사항**으로 구성. **사용자 기준**으로 작성 |
| **형상 관리 절차** | **식통감기** — 형상 식별 → 형상 통제 → 형상 감사 → 형상 기록 |
| **형상 관리 적용 범위** | 개발 **전 단계** + **유지보수 단계**까지 |
| **버전 등록 용어** | 저장소 · Import · **Check-Out** · **Check-In** · **Commit** · Update |
| **버전 등록 과정** | 가져오기 → 인출 → 예치 → 동기화 → 차이 |
| **공유 폴더 방식** | **SCCS · RCS · PVCS · QVCS** |
| **클라이언트/서버 방식** | **CVS · SVN · Clear Case · Perforce** |
| **분산 저장소 방식** | **Git · Mercurial · Bazaar · Bitkeeper** |
| **CVS 한계** | **파일 이름·디렉터리 변경, 심볼릭 링크 미지원** |
| **Git 개발자** | **리누스 토발즈**. 유지보수는 주니오 하마노 |
| **Git 영역** | 작업 트리 → **스테이지(add)** → 지역 저장소(commit) → **원격 저장소(push)** |
| **fetch vs pull** | fetch = **가져오기만**, pull = **가져와서 병합**(fetch+merge) |
| **빌드 도구** | **Ant(XML, 규칙 없음)** · **Maven(XML, 의존성·규칙 있음)** · **Gradle(Groovy, 안드로이드)** · **Jenkins(CI, 웹 GUI)** |
| **CI / CD** | CI = 지속적 **통합**(빌드·테스트 자동화) / CD = 지속적 **제공·배포** |
