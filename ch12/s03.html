## (3) 디지털 저작권 관리(DRM)

### 저작권(Copyright)

소설, 시, 논문, 강연, 연술, 도형, 음악, 영화, 춤, 그림, 조각, 건축물, 사진, 지도 등
**창작물을 만든 사람이 자신의 창작물에 대해 가지는 배타적 법적 권리**로,
타인의 침해를 받지 않을 고유한 권한.

### 디지털 저작권 관리(DRM; Digital Right Management) ⭐⭐

**저작권자가 배포한 디지털 콘텐츠가 저작권자가 의도한 용도로만 사용되도록**
**불법 복제 및 유통을 방지**하고 **저작권 관련 당사자의 권리 및 이익을 보호**해 주는 기술과 서비스.

### DRM 의 흐름과 구성 요소 ⭐⭐⭐

```mermaid
flowchart LR
    CP["콘텐츠 제공자<br/>(Contents Provider)"] --> PK["패키저<br/>(Packager)"]
    PK --> CD["콘텐츠 분배자<br/>(Contents Distributor)"]
    CD --> CS["클리어링 하우스<br/>(Clearing House)"]
    CD --> U["사용자<br/>(DRM 컨트롤러 + 보안 컨테이너)"]
    CS --> U
```

| 구성 요소 | 역할 |
|---|---|
| **클리어링 하우스**<br>(Clearing House) | **저작권에 대한 사용 권한, 라이선스 발급, 사용량에 따른 결제 관리** 등을 수행하는 곳 |
| **콘텐츠 제공자**<br>(Contents Provider) | **콘텐츠를 제공하는** 저작권자 |
| **패키저**<br>(Packager) | 콘텐츠를 **메타 데이터와 함께 배포 가능한 형태로 묶어** 암호화하는 프로그램 |
| **콘텐츠 분배자**<br>(Contents Distributor) | **암호화된 콘텐츠를 유통**하는 곳이나 사람 |
| **콘텐츠 소비자**<br>(Customer) | 콘텐츠를 **구매해서 사용하는** 주체 |
| **DRM 컨트롤러**<br>(DRM Controller) | 배포된 콘텐츠의 **이용 권한을 통제**하는 프로그램 |
| **보안 컨테이너**<br>(Security Container) | 콘텐츠 **원본을 안전하게 유통**하기 위한 전자적 보안 장치 |

> 📌 가장 자주 나오는 둘 — **클리어링 하우스(라이선스·결제 관리)** 와 **패키저(콘텐츠 암호화·묶음)**.

### DRM 의 기술 요소 ⭐⭐

| 기술 요소 | 내용 |
|---|---|
| **암호화**(Encryption) | 콘텐츠 및 라이선스를 암호화하고 **전자 서명**을 할 수 있는 기술 |
| **키 관리**(Key Management) | 콘텐츠를 **암호화한 키에 대한 저장 및 분배** 기술 |
| **암호화 파일 생성**(Packager) | 콘텐츠를 **암호화된 콘텐츠로 생성**하기 위한 기술 |
| **식별 기술**(Identification) | 콘텐츠에 대한 **식별 체계** 표현 기술 |
| **저작권 표현**(Right Expression) | **라이선스의 내용 표현** 기술 |
| **정책 관리**(Policy Management) | 라이선스 발급 및 사용에 대한 **정책 표현 및 관리** 기술 |
| **크랙 방지**(Tamper Resistance) | 크랙에 의한 **콘텐츠 사용 방지** 기술 |
| **인증**(Authentication) | 라이선스 발급 및 사용의 기준이 되는 **사용자 인증** 기술 |

> 💡 **크랙(Crack)** : 소프트웨어에 적용된 **저작권 보호 기술을 무력화**시키는 행위나 프로그램.
