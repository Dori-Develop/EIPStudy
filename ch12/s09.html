## (9) 빌드 자동화 도구

### 빌드(Build)

소스 코드 파일들을 **컴퓨터에서 실행할 수 있는 제품 소프트웨어로 변환**하는 과정 또는 결과물.

### 빌드 자동화 도구 ⭐⭐

빌드를 포함해 **테스트 및 배포를 자동화**하는 도구.

- **애자일(Agile)** 환경에서 **지속적 통합(CI; Continuous Integration)** 이 중요해지면서
  빌드 자동화 도구의 필요성이 커짐.

| 도구 | 특징 |
|---|---|
| **Ant**(Another Neat Tool) | **아파치 소프트웨어 재단**에서 개발한 자바 기반의 빌드 도구.<br>**XML 기반**의 빌드 스크립트를 사용. 정해진 규칙이나 표준이 없어 **개발자가 모든 것을 정의**해야 함 |
| **Maven** | 아파치 소프트웨어 재단에서 개발. **의존성(Dependency)을 설정**해 라이브러리를 관리.<br>**규칙이나 표준이 존재**해 예외 사항만 기록하면 됨. **pom.xml** 로 관리 |
| **Gradle** | **안드로이드 앱 개발 환경**에서 사용되는 빌드 도구.<br>**Groovy 기반**의 빌드 스크립트를 사용하며, **Ant 와 Maven 의 장점을 결합**.<br>실행할 처리 명령들을 모아 **테스크(Task)** 로 만든 후 태스크 단위로 실행 |
| **Jenkins** | **JAVA 기반의 오픈 소스** 형태로, 가장 많이 사용되는 **CI(지속적 통합) 도구**.<br>**서블릿 컨테이너**에서 실행되는 서버 기반 도구.<br>**SVN, Git 등 대부분의 형상 관리 도구와 연동**이 가능함.<br>**웹 기반 GUI** 를 제공해 사용이 쉬움. 친구를 뜻하는 이름에서 유래 |

> 📌 **XML = Ant/Maven**, **Groovy = Gradle**, **CI 서버 = Jenkins**.
> 이 대응만 잡으면 이 항목은 끝남.

### CI / CD ⭐

| 용어 | 의미 |
|---|---|
| **CI**(Continuous Integration, 지속적 통합) | 개발자들이 작성한 코드를 **자주(주로 매일) 통합 저장소에 병합**하고 **자동으로 빌드·테스트**하는 것 |
| **CD**(Continuous Delivery/Deployment, 지속적 제공/배포) | 통합된 코드를 **자동으로 릴리즈 및 배포**하는 것 |

**CI 의 장점**

- 통합 시 발생하는 **오류를 조기에 발견**할 수 있음
- 빌드와 테스트가 자동화되어 **개발 생산성이 향상**됨
- 배포 가능한 상태를 **항상 유지**할 수 있음
