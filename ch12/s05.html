## (5) 소프트웨어 사용자 매뉴얼 작성

### 소프트웨어 사용자 매뉴얼 ⭐

사용자가 소프트웨어를 사용하는 과정에서 **필요한 내용을 문서로 기록**한 설명서와 안내서.

- 사용자가 소프트웨어 사용에 필요한 절차, 환경 등의 **전반적인 내용이 기록**되어 있음.
- 개발된 **컴포넌트 사용 시 알아야 할 내용**을 기술.
- 컴포넌트 명세서와 컴포넌트 구현 설계서를 토대로 작성.
- 사용자 매뉴얼은 **컴포넌트 단위로 작성**.
- 사용자가 사용 방법을 이해하기 쉽도록 **상황별로 누락 없이 캡처**해 작성.

### 사용자 매뉴얼의 구성 요소

| 구성 | 내용 |
|---|---|
| **목차 및 개요** | 매뉴얼 전체 내용을 순서대로 요약 |
| **서문** | **문서 이력, 사용자 매뉴얼의 주석, 기록 보관 내용** 기술 |
| **기본 사항** | **소프트웨어 개요, 사용, 관리, 모델·버전별 특징, 기능·인터페이스의 특징, 구동 환경** 등 기술 |

### 사용자 매뉴얼 작성 순서

```mermaid
flowchart LR
    A[작성 지침 정의] --> B[사용자 매뉴얼 구성 요소 정의] --> C[구성 요소별 내용 작성] --> D[사용자 매뉴얼 검토]
```
