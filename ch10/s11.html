## (11) 프로그래밍 언어의 분류

### 절차적 프로그래밍 언어 ⭐

**일련의 처리 절차를 정해진 문법에 따라 순서대로 기술**하는 언어.

- 프로그램 전체가 유기적으로 연결되어 있어 **대규모 프로그램에는 부적합**함.
- 데이터와 함수가 분리되어 있음.

| 언어 | 특징 |
|---|---|
| **C** | **1972년 벨 연구소의 데니스 리치**가 개발. **UNIX 운영체제를 위한 언어**. 이식성이 좋아 컴퓨터 기종에 관계없이 사용 가능 |
| **ALGOL** | 수치 계산이나 논리 연산을 위한 과학 기술 계산용 언어 |
| **COBOL** | **사무 처리용** 언어. 영어 문장 형식으로 구성 |
| **FORTRAN** | **과학 기술 계산용** 언어 |
| **PASCAL** | 교육용으로 개발된 언어 |

### 객체 지향 프로그래밍 언어 ⭐

**현실 세계의 개체를 객체로 만들어** 조립해서 프로그램을 구현하는 언어.

| 언어 | 특징 |
|---|---|
| **JAVA** | **분산 네트워크 환경**에 적용 가능. **운영체제 및 하드웨어에 독립적**(JVM). 실시간 정보를 통해 애니메이션을 구현 |
| **C++** | C 언어에 객체 지향 개념을 추가한 언어 |
| **Smalltalk** | **1980년대 앨런 케이**가 개발. **최초로 GUI 를 제공**한 언어 |

**객체 지향 프로그래밍 언어의 구성 요소** — 객체(Object), 클래스(Class), 메시지(Message)

**객체 지향 프로그래밍 언어의 특징** — 캡슐화, 정보 은닉, 추상화, 상속성, 다형성

### 스크립트 언어 ⭐⭐

**HTML 문서 안에 직접 프로그래밍 언어를 삽입**해 사용하는 언어.
**기계어로 컴파일되지 않고 실행되는 인터프리터 방식**임.

| 구분 | 설명 | 종류 |
|---|---|---|
| **서버용 스크립트 언어** | 서버에서 실행된 후 결과만 클라이언트로 보냄 | **ASP, JSP, PHP, Python** |
| **클라이언트용 스크립트 언어** | 클라이언트의 웹 브라우저에서 실행됨 | **JavaScript, VBScript** |

| 언어 | 특징 |
|---|---|
| **JavaScript** | 클라이언트용 스크립트 언어. 웹 페이지의 동작을 구현. **Netscape 사**에서 개발 |
| **JSP**(Java Server Page) | **JAVA 로 만들어진 서버용 스크립트 언어**. 다양한 운영체제에서 사용 가능 |
| **PHP** | 서버용 스크립트 언어. **C, Java 등과 문법이 유사**하고 배우기 쉬움 |
| **ASP**(Active Server Page) | 서버용 스크립트 언어. **Windows 계열에서만** 수행 가능 |
| **Python** | 인터프리터 방식의 객체 지향 언어. **플랫폼에 독립적**이고 **문법이 간단**해 초보자도 쉽게 배울 수 있음 |
| **Basic** | 절차 지향 기능도 지원하는 **문법이 쉬운 언어** |

**스크립트 언어의 장·단점**

| 장점 | 단점 |
|---|---|
| 컴파일 없이 **바로 실행**하므로 결과를 빠르게 확인 | 코드를 **읽고 해석해야 하므로 실행 속도가 느림** |
| 개발 시간이 짧고 **소스 코드 수정이 간단** | **런타임 오류가 많이 발생** |

### 선언형 언어 ⭐

**프로그램이 수행해야 할 문제를 기술**하는 언어. **목표를 명시**하고 알고리즘은 명시하지 않음.

| 구분 | 설명 | 종류 |
|---|---|---|
| **함수형 언어** | **수학적 함수를 조합**해 문제를 해결 | **LISP, ML, Haskell** |
| **논리형 언어** | **논리 문장을 이용**해 문제를 해결. 비절차적 언어 | **PROLOG** |
| **기타** | – | **HTML, XML, SQL, Haskell** |

| 언어 | 특징 |
|---|---|
| **HTML** | 인터넷의 **표준 문서인 하이퍼텍스트 문서**를 만들기 위해 사용하는 언어 |
| **LISP** | **인공지능 분야**에 사용되는 함수형 언어. **1960년 매카시**가 개발 |
| **PROLOG** | **논리학을 기초**로 한 언어. 인공지능 분야의 **논리적 추론이나 삼단 논법** 표현에 적합 |
| **XML** | 기존 HTML 의 단점을 보완해 **사용자가 새로운 태그를 정의**할 수 있는 언어 |
| **Haskell** | **함수형 프로그래밍 언어**. 부작용(Side Effect)이 없음 |
