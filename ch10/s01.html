## (1) 데이터 타입과 변수

### 데이터 타입(Data Type)

변수에 저장될 **데이터의 형식**을 나타내는 것.

### C 언어의 기본 데이터 타입 ⭐

| 종류 | 타입 | 크기 | 범위 |
|---|---|---|---|
| **문자** | `char` | 1Byte | −128 ~ 127 |
| **정수** | `short` | 2Byte | −32,768 ~ 32,767 |
| | `int` | 4Byte | −2,147,483,648 ~ 2,147,483,647 |
| | `long` | 4Byte | int 와 동일 |
| | `long long` | 8Byte | 매우 큰 정수 |
| **부동 소수점** | `float` | 4Byte | 단정도 실수 |
| | `double` | 8Byte | 배정도 실수 |

> 💡 `unsigned` 를 붙이면 **음수를 표현하지 않고 양수 범위가 2배**가 됨.
> `unsigned char` 는 **0 ~ 255**.

### Java 의 기본 데이터 타입

| 종류 | 타입 | 크기 |
|---|---|---|
| **문자** | `char` | 2Byte |
| **정수** | `byte` / `short` / `int` / `long` | 1 / 2 / 4 / 8 Byte |
| **부동 소수점** | `float` / `double` | 4 / 8 Byte |
| **논리** | `boolean` | 1Byte |

### 변수(Variable)

컴퓨터가 **명령을 처리하는 도중 발생하는 값을 저장하기 위한 공간**.

**변수명 작성 규칙** ⭐

- **영문자, 숫자, `_`(underscore)** 를 사용할 수 있음
- 첫 글자는 **영문자나 `_`** 로 시작해야 하며, **숫자로 시작할 수 없음**
- **공백이나 특수문자를 포함할 수 없음**
- **예약어(Reserved Word)** 를 변수명으로 사용할 수 없음
- 대·소문자를 **구분**함

### 기억 클래스(Storage Class) ⭐

| 종류 | 지정 예약어 | 기억 영역 | 존재 범위 |
|---|---|---|---|
| **자동 변수** | `auto` | **스택(Stack)** | 함수 내부 |
| **레지스터 변수** | `register` | **레지스터** | 함수 내부 |
| **정적 변수** | `static` | **데이터 영역** | 프로그램 전체(내부/외부) |
| **외부 변수** | `extern` | **데이터 영역** | 프로그램 전체 |
