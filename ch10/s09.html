## (9) Java의 상속과 다형성

### 상속(Inheritance) ⭐⭐

```java
class 자료 {
    void 정보() { System.out.println("자료입니다"); }
}

class 도서 extends 자료 {          // 자료를 상속
    void 정보() {                  // 오버라이딩(재정의)
        System.out.println("도서입니다");
    }
}
```

### 오버로딩 vs 오버라이딩 ⭐⭐⭐

| 구분 | 오버로딩(Overloading) | 오버라이딩(Overriding) |
|---|---|---|
| 의미 | **같은 이름의 메소드를 여러 개** 정의 | **상위 클래스의 메소드를 재정의** |
| 위치 | **같은 클래스** 안 | **상속 관계**의 클래스 사이 |
| 매개변수 | **달라야 함**(개수 또는 타입) | **같아야 함** |
| 반환형 | 상관없음 | **같아야 함** |

```java
// 오버로딩 — 같은 클래스 안, 매개변수가 다름
int add(int a, int b) { return a + b; }
double add(double a, double b) { return a + b; }
```

### super 와 this

| 키워드 | 의미 |
|---|---|
| **this** | **현재 객체 자신**을 가리킴 |
| **this()** | 같은 클래스의 **다른 생성자**를 호출 |
| **super** | **상위 클래스**를 가리킴 |
| **super()** | **상위 클래스의 생성자**를 호출 |

### 추상 클래스와 인터페이스 ⭐

| 구분 | 추상 클래스(abstract) | 인터페이스(interface) |
|---|---|---|
| 목적 | 공통 기능을 **상속**시킴 | **구현을 강제**함 |
| 메소드 | 일반 메소드 + 추상 메소드 | (기본적으로) **추상 메소드만** |
| 상속 | **단일 상속**(extends) | **다중 구현 가능**(implements) |

```java
interface 대출가능 {
    void 대출();          // 추상 메소드
}

class 도서 implements 대출가능 {
    public void 대출() { System.out.println("도서 대출"); }
}
```
