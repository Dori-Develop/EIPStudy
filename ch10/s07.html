## (7) 사용자 정의 함수

### 함수(Function)

특정 기능을 수행하는 코드의 묶음.

```c
반환형 함수명(매개변수 목록) {
    실행문;
    return 반환값;
}
```

```c
int add(int a, int b) {
    return a + b;
}

int main() {
    printf("%d", add(3, 5));   // 8
    return 0;
}
```

### 매개변수 전달 방식 ★★

| 방식 | 설명 |
|---|---|
| **값에 의한 호출**<br>(Call by Value) | 매개변수에 **값을 복사해서 전달**. 원본 값이 **변경되지 않음** |
| **주소에 의한 호출**<br>(Call by Reference) | 매개변수에 **주소를 전달**. 원본 값이 **변경됨** |

```c
void swapValue(int a, int b) {       // 값에 의한 호출
    int t = a; a = b; b = t;
}
void swapRef(int *a, int *b) {       // 주소에 의한 호출
    int t = *a; *a = *b; *b = t;
}

int x = 1, y = 2;
swapValue(x, y);      // x=1, y=2   (변화 없음)
swapRef(&x, &y);      // x=2, y=1   (교환됨)
```

### 재귀 함수(Recursive Function) ★

**자기 자신을 다시 호출**하는 함수.

```c
int factorial(int n) {
    if (n <= 1) return 1;
    return n * factorial(n - 1);
}
// factorial(5) = 5*4*3*2*1 = 120
```

> ⚠️ 재귀 함수는 반드시 **종료 조건**이 있어야 함. 없으면 **스택 오버플로**가 발생.
