## (3) 제어문

### 조건문

**if 문**

```c
if (조건) {
    실행문;
} else if (조건) {
    실행문;
} else {
    실행문;
}
```

**switch 문** ⭐

```c
switch (수식) {
    case 값1: 실행문; break;
    case 값2: 실행문; break;
    default:  실행문;
}
```

> ⚠️ **`break` 를 생략하면 다음 case 문까지 계속 실행**됨(fall-through).
> 이 성질을 이용한 출제가 자주 나옴.

### 반복문 ⭐⭐

| 반복문 | 형식 | 특징 |
|---|---|---|
| **for** | `for (초기식; 조건식; 증감식) { }` | 반복 횟수가 정해진 경우 |
| **while** | `while (조건) { }` | 조건을 **먼저 검사** → 조건이 거짓이면 **한 번도 실행 안 됨** |
| **do~while** | `do { } while (조건);` | 실행 후 조건 검사 → **최소 한 번은 실행됨** |

> ⚠️ **do~while 은 반드시 한 번은 실행됨.** while 과의 차이로 자주 출제됨.

### 기타 제어문

| 명령 | 의미 |
|---|---|
| **break** | 반복문이나 switch 문을 **완전히 빠져나감** |
| **continue** | 현재 반복을 **건너뛰고 다음 반복으로** 넘어감 |
| **goto** | 지정된 **레이블로 이동** |

**예제 — 결과를 예측해 볼 것**

```c
int sum = 0;
for (int i = 1; i <= 10; i++) {
    if (i % 2 == 0) continue;
    if (i > 7) break;
    sum += i;
}
// i=1,3,5,7 만 더해짐 → sum = 16
```
