## (13) 예외 처리

### 예외(Exception)

프로그램의 정상적인 실행을 방해하는 조건이나 상태.

**예외의 원인** — 컴퓨터 하드웨어 문제, 운영체제의 설정 실수, 라이브러리 손상,
사용자의 입력 실수, 받아들일 수 없는 연산, 할당하지 못하는 기억 장치 접근 등

### 예외 처리(Exception Handling) ⭐⭐

프로그램의 오류가 발생했을 때 **오류를 처리하는 방법**.
오류 발생 시 **프로그램이 비정상적으로 종료되는 것을 방지**.

### Java의 예외 처리

```java
try {
    // 예외가 발생할 가능성이 있는 코드
    int result = 10 / 0;
} catch (ArithmeticException e) {
    // 예외 발생 시 실행되는 코드
    System.out.println("0으로 나눌 수 없습니다");
} finally {
    // 예외 발생 여부와 관계없이 항상 실행되는 코드
    System.out.println("종료");
}
```

| 블록 | 역할 |
|---|---|
| **try** | 예외가 발생할 가능성이 있는 코드를 작성 |
| **catch** | 예외가 발생했을 때 처리할 코드를 작성 |
| **finally** | **예외 발생 여부와 관계없이 반드시 실행**되는 코드 |

> ⚠️ **finally 블록은 예외가 발생하든 안 하든 항상 실행됨.** 자원 반환 코드를 여기에 둠.

### Java의 주요 예외 객체 ⭐

| 예외 객체 | 발생 상황 |
|---|---|
| **ClassNotFoundException** | 클래스를 찾지 못한 경우 |
| **NoSuchMethodException** | 메소드를 찾지 못한 경우 |
| **FileNotFoundException** | 파일을 찾지 못한 경우 |
| **InterruptedIOException** | 입·출력 처리가 중단된 경우 |
| **ArithmeticException** | **0으로 나누는 등** 산술 연산에 오류가 발생한 경우 |
| **IllegalArgumentException** | 잘못된 인자를 전달한 경우 |
| **NumberFormatException** | 숫자로 **변환할 수 없는 문자열**을 변환한 경우 |
| **ArrayIndexOutOfBoundsException** | **배열의 범위를 벗어난** 인덱스에 접근한 경우 |
| **NullPointerException** | **null 인 객체**의 멤버에 접근한 경우 |

### Python의 예외 처리

```python
try:
    result = 10 / 0
except ZeroDivisionError:
    print("0으로 나눌 수 없습니다")
except Exception as e:
    print("기타 오류:", e)
else:
    print("예외가 발생하지 않았을 때 실행")
finally:
    print("항상 실행")
```

> 💡 Python 은 Java 와 달리 **`else` 블록**이 있음. 예외가 발생하지 않았을 때만 실행됨.
