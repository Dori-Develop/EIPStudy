## (8) Java의 클래스

### 클래스와 객체

```java
class 회원 {
    String 이름;                     // 필드(속성)
    int    누적대출수;

    회원(String 이름) {              // 생성자
        this.이름 = 이름;
        this.누적대출수 = 0;
    }

    void 대출() {                     // 메소드
        누적대출수++;
    }
}

public class Main {
    public static void main(String[] args) {
        회원 m = new 회원("김하늘");   // 객체 생성
        m.대출();
        System.out.println(m.누적대출수);  // 1
    }
}
```

### 접근 제어자 ★★

| 제어자 | 같은 클래스 | 같은 패키지 | 하위 클래스 | 전체 |
|---|:---:|:---:|:---:|:---:|
| **private** | O | X | X | X |
| **default**(생략) | O | O | X | X |
| **protected** | O | O | O | X |
| **public** | O | O | O | O |

> 📌 접근 범위: **private < default < protected < public**

### 생성자(Constructor)

객체가 생성될 때 **자동으로 호출**되는 메소드.

- **클래스 이름과 동일**하며 **반환형이 없음**.
- 생성자를 정의하지 않으면 **기본 생성자**가 자동으로 만들어짐.

### static

- **객체를 생성하지 않고도** 사용할 수 있는 필드나 메소드.
- 모든 객체가 **공유**.

```java
class Counter {
    static int count = 0;
    Counter() { count++; }
}
// Counter 를 3개 만들면 Counter.count 는 3
```
