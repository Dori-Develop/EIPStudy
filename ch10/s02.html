## (2) 연산자

### 연산자 우선순위 ⭐⭐

| 순위 | 연산자 | 종류 |
|:---:|---|---|
| 1 | `()` `[]` `->` `.` | 최우선 연산자 |
| 2 | `!` `~` `++` `--` `sizeof` `+`(부호) `-`(부호) | 단항 연산자 |
| 3 | `*` `/` `%` | 산술(곱셈, 나눗셈, 나머지) |
| 4 | `+` `-` | 산술(덧셈, 뺄셈) |
| 5 | `<<` `>>` | 시프트 |
| 6 | `<` `<=` `>` `>=` | 관계(대소) |
| 7 | `==` `!=` | 관계(등가) |
| 8 | `&` → `^` → `\|` | 비트 |
| 9 | `&&` → `\|\|` | 논리 |
| 10 | `? :` | 삼항(조건) |
| 11 | `=` `+=` `-=` `*=` `/=` `%=` | 대입 |
| 12 | `,` | 순서 |

> 📌 암기: **"단산시관비논삼대순"** (단항→산술→시프트→관계→비트→논리→삼항→대입→순서)

### 증감 연산자 ⭐⭐

| 연산자 | 의미 |
|---|---|
| **`++a`**(전치) | **먼저 1을 증가**시킨 후 연산에 사용 |
| **`a++`**(후치) | **먼저 연산에 사용**한 후 1을 증가 |

```c
int a = 5, b;
b = ++a;     // a=6, b=6  (먼저 증가)
```

```c
int a = 5, b;
b = a++;     // b=5, a=6  (먼저 대입)
```

### 비트 연산자 ⭐

| 연산자 | 의미 | 예 (`a=12`(1100), `b=10`(1010)) |
|:---:|---|---|
| `&` | AND (둘 다 1이면 1) | `a & b` = 1000 = **8** |
| `\|` | OR (하나라도 1이면 1) | `a \| b` = 1110 = **14** |
| `^` | XOR (서로 다르면 1) | `a ^ b` = 0110 = **6** |
| `~` | NOT (비트 반전) | `~a` = **−13** |
| `<<` | 왼쪽 시프트 (×2) | `a << 1` = 11000 = **24** |
| `>>` | 오른쪽 시프트 (÷2) | `a >> 1` = 110 = **6** |
