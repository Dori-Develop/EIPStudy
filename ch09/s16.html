## 📌 부록 — 핵심 암기 요약

| 구분 | 암기 포인트 |
|---|---|
| **보안 3대 요소** | **기무가** — 기밀성 · 무결성 · 가용성 (CIA) |
| **Secure SDLC 방법론 3가지** | **CLASP** · **SDL**(MS) · **Seven Touchpoints** |
| **보안 점검 항목 7** | **입보시에코캡API** — 입력 검증·보안 기능·시간과 상태·에러 처리·코드 오류·캡슐화·API 오용 |
| **입력 검증 보안 약점 6가지** | **SQL 삽입 · XSS · 경로 조작 · OS 명령어 삽입 · 위험한 파일 업로드 · 버퍼 오버플로** |
| **SQL 삽입 대응** | **정적 쿼리(PreparedStatement)** 사용 |
| **XSS 대응** | **HTML 특수문자 치환** |
| **시간·상태 보안 약점 2가지** | **경쟁 조건(Race Condition, TOCTOU)** · 종료되지 않는 반복문 |
| **코드 오류 보안 약점 3가지** | **널 포인터 역참조** · 부적절한 자원 해제 · 초기화되지 않은 변수 |
| **대칭키 블록 암호 5가지** | **DES**(블록 64비트·키 56비트) · **AES**(키 128~256비트) · **SEED**(KISA 개발) · **ARIA**(국정원 개발) · **IDEA**(블록 64비트·키 128비트) |
| **대칭키 스트림 암호 2가지** | **RC4 · LFSR** |
| **비대칭키 암호 5가지** | **RSA(소인수분해) · ECC(타원곡선) · Diffie-Hellman(키 교환) · Rabin · DSA** |
| **해시 알고리즘 5가지** | **MD5(128) · SHA(160~512) · HAS-160 · N-NASH · SNEFRU** |
| **암호 방식별 필요 키 개수** | 사용자가 **N명**일 때 대칭키는 **N(N−1)/2개**, 공개키는 **2N개** |
| **DoS 공격 5가지** | **Ping of Death**(큰 패킷) · **SMURFING** · **SYN Flooding**(3-Way-Handshake) · TearDrop · **LAND**(송수신 IP 동일) |
| **DDoS 공격 도구 3가지** | 트리누 · TFN · 스타첼드라트 |
| **웜 vs 트로이 목마** | 웜 = **자기 복제 O**, 트로이 목마 = **자기 복제 X** |
| **제로 데이 공격** | **패치 발표 전**에 이뤄지는 공격 |
| **스니핑 vs 스푸핑** | 스니핑 = **엿봄**, 스푸핑 = **위조·가장** |
| **인증 유형 5가지** | **지소생위행** — 지식·소유·생체·위치·행위 |
| **커버로스** | **대칭키 기반 티켓 인증** 프로토콜 |
| **리눅스 로그 파일 5가지** | **wtmp(성공)** · **btmp(실패)** · utmp(현재) · lastlog · secure |
| **보안 솔루션 9가지** | 방화벽 · **IDS**(침입 탐지) · **IPS**(침입 차단) · **DLP**(데이터 유출 방지) · 웹 방화벽 · **VPN**(가상 사설망) · **NAC**(네트워크 접근 제어) · **ESM**(통합 보안 관리) · **SIEM**(보안 정보·이벤트 관리) |
| **IDS 분류 — 위치별** | **HIDS**(호스트) · **NIDS**(네트워크) |
| **IDS 분류 — 탐지 방식별** | **오용 탐지**(알려진 패턴) · **이상 탐지**(정상에서 벗어난 행위) |
| **ISO 27001** | 정보보호 관리 체계(**ISMS**) 국제 표준 |
