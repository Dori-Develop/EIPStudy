## (11) 서버 인증

### 인증(Authentication) ⭐⭐

다중 사용자 컴퓨터 시스템이나 네트워크 시스템에서
**로그인을 요청한 사용자의 정보를 확인하고 접근 권한을 검증**하는 보안 절차.

### 인증의 주요 유형 ⭐⭐

| 유형 | 기반 | 예 |
|---|---|---|
| **지식 기반 인증**<br>(Something You Know) | 사용자가 **기억하고 있는 정보** | **아이디/패스워드**, i-PIN |
| **소유 기반 인증**<br>(Something You Have) | 사용자가 **소유하고 있는 것** | **신분증, 메모리 카드(토큰), 스마트 카드, OTP** |
| **생체 기반 인증**<br>(Something You Are) | 사용자의 **고유한 생체 정보** | **지문, 홍채, 얼굴, 정맥** |
| **위치 기반 인증**<br>(Somewhere You Are) | 사용자의 **위치 정보** | **GPS, IP 주소** |
| **행위 기반 인증**<br>(Something You Do) | 사용자의 **행동 정보** | **서명, 걸음걸이** |

> 📌 암기: **"지소생위행"**

### 관련 용어

| 용어 | 의미 |
|---|---|
| **OTP**(One Time Password) | **한 번만 사용할 수 있는 비밀번호**. 무작위로 생성되어 재사용이 불가 |
| **SSO**(Single Sign On) | **한 번의 인증**으로 여러 시스템에 접근할 수 있게 하는 통합 인증 |
| **커버로스**(Kerberos) | **대칭키 암호 기법**에 바탕을 둔 **티켓 기반 인증 프로토콜** |
| **다중 요소 인증**(MFA) | 위 유형 중 **둘 이상을 조합**해 인증하는 방식 |
