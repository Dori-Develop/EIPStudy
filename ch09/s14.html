## (14) 보안 솔루션

### 보안 솔루션 ★★

접근 통제, 침입 차단 및 탐지 등을 수행하여
**외부로부터의 불법적인 침입을 막는 기술 및 시스템**.

| 솔루션 | 설명 |
|---|---|
| **방화벽**(Firewall) | 기업이나 조직 내부의 네트워크와 인터넷 간에 전송되는 정보를 선별해 **수용·거부·수정하는 기능**을 가진 침입 차단 시스템 |
| **침입 탐지 시스템**<br>(IDS; Intrusion Detection System) | 컴퓨터 시스템의 비정상적인 사용, 오용, 남용 등을 **실시간으로 탐지**하는 시스템 |
| **침입 방지 시스템**<br>(IPS; Intrusion Prevention System) | 방화벽과 침입 탐지 시스템을 결합한 것으로, **비정상적인 트래픽을 능동적으로 차단**하고 격리 |
| **데이터 유출 방지**<br>(DLP; Data Loss Prevention) | 내부 정보의 **외부 유출을 방지**하는 솔루션 |
| **웹 방화벽**(Web Firewall) | 일반적인 방화벽이 탐지하지 못하는 **SQL 삽입 공격, XSS 등 웹 기반 공격을 방어** |
| **VPN**(Virtual Private Network, 가상 사설 통신망) | 공중 네트워크와 암호화 기술을 이용해 **사용자가 마치 자신의 전용 회선을 사용하는 것처럼** 해 주는 보안 솔루션 |
| **NAC**(Network Access Control) | 네트워크에 접속하는 **내부 PC 의 MAC 주소를 IP 관리 시스템에 등록**한 후, 일관된 보안 관리 기능을 제공하는 시스템 |
| **ESM**(Enterprise Security Management) | 다양한 보안 장비에서 발생하는 로그 및 보안 이벤트를 **통합해서 관리**하는 솔루션 |
| **SIEM**(Security Information and Event Management) | ESM 에 **빅데이터 분석 기능**을 더해, 장기간의 로그를 수집·분석하는 솔루션 |

### IDS 의 분류 ★

**위치에 따른 분류**

| 종류 | 설명 |
|---|---|
| **HIDS**(Host-Based IDS) | **개별 호스트(서버)** 에 설치되어 해당 시스템의 자원 사용 실태를 분석 |
| **NIDS**(Network-Based IDS) | **네트워크 구간**에 설치되어 패킷을 분석 |

**탐지 방법에 따른 분류** ★

| 종류 | 설명 |
|---|---|
| **오용 탐지**(Misuse Detection) | **미리 입력해 둔 공격 패턴(시그니처)** 이 감지되면 알림. **알려진 공격에 강함**. 오탐률이 낮음 |
| **이상 탐지**(Anomaly Detection) | **평균적인 시스템 상태를 기준**으로 비정상적인 행위나 자원 사용이 감지되면 알림. **알려지지 않은 공격(제로데이)도 탐지 가능**하나 오탐률이 높음 |

> ⚠️ **오용 탐지 = 알려진 패턴**, **이상 탐지 = 정상에서 벗어난 행위**. 매번 나옴.

### 보안 프로토콜 ★★

**VPN 을 만들거나 통신 구간을 지키는 데 쓰는 규약들.** 어느 계층에서 도느냐로 갈림.

| 프로토콜 | 계층 | 설명 |
|---|---|---|
| **IPSec**(IP Security) ★ | **네트워크(3)** | IP 패킷 자체를 **인증·암호화**하는 표준.<br>- **AH**(Authentication Header) : 인증·무결성만. **암호화는 안 함**<br>- **ESP**(Encapsulating Security Payload) : **암호화까지** 함<br>- **전송 모드**(페이로드만) / **터널 모드**(헤더까지 통째로) |
| **SSL / TLS** | **전송(4)** | 웹 트래픽을 지키는 규약. **HTTPS** 가 이것을 씀 |
| **S-HTTP** | **응용(7)** | HTTP 메시지 **하나하나**를 암호화 |
| **L2TP**(Layer 2 Tunneling Protocol) | **데이터링크(2)** | **PPTP 와 L2F 를 합친** 터널링 프로토콜.<br>🚨 **자체 암호화 기능이 없어** 보통 **IPSec 과 함께**(L2TP/IPSec) 쓴다 |
| **SSH**(Secure Shell) ★ | **응용(7)** | 원격 접속·파일 전송을 **암호화**해 주는 규약. **기본 포트 22번**.<br>평문으로 오가던 **Telnet(23) · FTP(21) 를 대체**한다 |

> 🚨 **L2TP 는 터널만 뚫고 암호는 IPSec 이 건다.** 짝으로 묻는 문항이 나옴.
> 📌 **IPSec 의 AH 와 ESP 차이**(암호화 유무)도 단골이다.

### 하드웨어 기반 보안 ★

| 기술 | 설명 |
|---|---|
| **TrustZone** | **ARM 이 만든** 하드웨어 분리 기술. 프로세서 안을 **일반 영역과 보안 영역으로 갈라**,<br>결제·생체 정보 같은 민감한 처리를 **보안 영역에서만** 수행 |
| **TPM**(Trusted Platform Module) | 암호키를 **칩 안에 보관**하는 보안 모듈 |
