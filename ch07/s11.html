## (11) 테스트 자동화 도구

### 테스트 자동화

사람이 반복적으로 수행하던 테스트 절차를 **스크립트 형태로 구현하는 자동화 도구**를 적용함으로써
**시간 단축과 인력 투입 비용을 최소화**하는 것.

**장점과 단점**

| 장점 | 단점 |
|---|---|
| 휴먼 에러(Human Error)를 줄임 | 자동화 도구의 **사용법에 대한 교육 및 학습**이 필요 |
| 향상된 **테스트 품질** 보장 | 자동화 도구를 프로세스 단계별로 **적용하기 위한 시간·비용·노력**이 필요 |
| 사용자의 **요구사항을 명확히 파악** 가능 | 상용 도구의 경우 **고가**이며, 오픈 소스는 **제한적인 기능**만 제공 |
| 테스트 **결과에 대한 객관적인 평가 기준** 제공 | |

### 테스트 자동화 도구의 유형 ⭐⭐

| 유형 | 설명 |
|---|---|
| **정적 분석 도구**<br>(Static Analysis Tools) | 만들어진 애플리케이션을 **실행하지 않고** 소스 코드에 대한 **코딩 표준, 코딩 스타일, 코드 복잡도, 남은 결함** 등을 발견하기 위해 사용 |
| **테스트 실행 도구**<br>(Test Execution Tools) | 스크립트 언어를 사용해 **테스트를 실행**하는 도구. **데이터 주도 접근 방식**과 **키워드 주도 접근 방식**이 있음 |
| **성능 테스트 도구**<br>(Performance Test Tools) | 애플리케이션의 **처리량, 응답 시간, 경과 시간, 자원 사용률**에 대해 가상의 사용자를 생성하고 테스트를 수행함으로써 성능 목표 달성 여부를 확인 |
| **테스트 통제 도구**<br>(Test Control Tools) | **테스트 계획 및 관리, 테스트 수행, 결함 관리** 등을 수행하는 도구. **형상 관리 도구, 결함 추적/관리 도구** 등이 있음 |
| **테스트 하네스 도구**<br>(Test Harness Tools) | 애플리케이션의 **컴포넌트 및 모듈을 테스트하는 환경의 일부분**으로, 테스트를 지원하기 위해 생성된 코드와 데이터 |

### 테스트 실행 도구의 접근 방식

| 방식 | 설명 |
|---|---|
| **데이터 주도 접근 방식** | 테스트 데이터를 **스프레드시트에 저장**하고, 이 데이터를 읽어 실행하는 방식.<br>다양한 테스트 데이터를 편리하게 사용할 수 있음 |
| **키워드 주도 접근 방식** | 테스트를 수행할 **동작을 나타내는 키워드와 테스트 데이터를 스프레드시트에 저장**해 실행하는 방식.<br>키워드를 이용해 테스트를 정의할 수 있음 |

### 테스트 하네스의 구성 요소 ⭐⭐

| 구성 요소 | 내용 |
|---|---|
| **테스트 드라이버**<br>(Test Driver) | 테스트 대상의 **하위 모듈을 호출**하고, 파라미터를 전달하고, 모듈 테스트 수행 후의 **결과를 도출**하는 도구 |
| **테스트 스텁**<br>(Test Stub) | 제어 모듈이 호출하는 **하위 모듈의 역할을 하는 도구**로, 일시적으로 필요한 조건만을 가지고 있는 테스트용 모듈 |
| **테스트 슈트**<br>(Test Suites) | 테스트 대상 컴포넌트나 모듈, 시스템에 사용되는 **테스트 케이스의 집합** |
| **테스트 케이스**<br>(Test Case) | 사용자의 요구사항을 정확하게 준수했는지 확인하기 위한 **입력값, 실행 조건, 기대 결과** 등으로 만들어진 테스트 항목의 명세서 |
| **테스트 스크립트**<br>(Test Script) | **자동화된 테스트 실행 절차**에 대한 명세서 |
| **목 오브젝트**<br>(Mock Object) | **사전에 사용자의 행위를 조건부로 입력**해 두면, 그 상황에 맞는 예정된 행위를 수행하는 객체 |
