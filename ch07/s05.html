## (5) 블랙박스 테스트

### 블랙박스 테스트(Black Box Test) ⭐⭐

소프트웨어가 수행할 **특정 기능을 알기 위해 각 기능이 완전히 작동되는 것을 입증**하는 테스트.
**기능 테스트**라고도 함.

- 사용자의 **요구사항 명세를 보면서** 테스트.
- 주로 **구현된 기능을 테스트**하며, 소프트웨어 **인터페이스에서 실시**됨.
- 테스트 과정의 **후반부에 적용**됨.
- 부정확하거나 누락된 기능, 인터페이스 오류, 자료 구조나 외부 데이터베이스 접근에 따른 오류,
  행위나 성능 오류, 초기화와 종료 오류 등을 발견하기 위해 사용됨.

### 블랙박스 테스트의 종류 ⭐⭐⭐

| 종류 | 설명 |
|---|---|
| **동치 분할 검사**<br>(Equivalence Partitioning Testing) | 입력 자료에 초점을 맞춰 테스트 케이스를 만들고 검사하는 방법.<br>프로그램의 입력 조건에 **타당한 입력 자료와 타당하지 않은 입력 자료의 개수를 균등하게** 하여 테스트 케이스를 정함.<br>**동등 분할 기법**이라고도 함 |
| **경계값 분석**<br>(Boundary Value Analysis) | 입력 조건의 **중간값보다 경계값에서 오류가 발생될 확률이 높다는 점**을 이용해, **입력 조건의 경계값을 테스트 케이스로 선정**해 검사 |
| **원인-효과 그래프 검사**<br>(Cause-Effect Graphing Testing) | 입력 데이터 간의 관계와 출력에 미치는 영향을 분석해 **효용성이 높은 테스트 케이스를 선정**해 검사 |
| **오류 예측 검사**<br>(Error Guessing) | 과거의 경험이나 **확인자의 감각으로 테스트**하는 기법. 다른 테스트 기법으로는 찾기 어려운 오류를 찾아냄. **데이터 확인 검사**라고도 함 |
| **비교 검사**<br>(Comparison Testing) | **여러 버전의 프로그램에 동일한 테스트 자료를 제공**해 동일한 결과가 출력되는지 검사 |

> 💡 **경계값 분석**은 예를 들어 입력 조건이 `1 ≤ x ≤ 100` 이면
> **0, 1, 2, 99, 100, 101** 처럼 **경계 부근**을 테스트 케이스로 잡음.

### 화이트박스 vs 블랙박스 ⭐

| 구분 | 화이트박스 | 블랙박스 |
|---|---|---|
| 관점 | **내부 구조(코드)** | **기능(명세)** |
| 별칭 | 구조적 테스트 | 기능 테스트 |
| 적용 시점 | 테스트 **초기** | 테스트 **후반** |
| 대표 기법 | 기초 경로 검사, 조건·루프·데이터 흐름 검사 | 동치 분할, 경계값 분석, 원인-효과 그래프, 오류 예측, 비교 검사 |
