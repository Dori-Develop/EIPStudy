## (4) 화이트박스 테스트

### 화이트박스 테스트(White Box Test) ⭐⭐

모듈의 **원시 코드를 오픈시킨 상태**에서 원시 코드의 **논리적인 모든 경로를 테스트**해
테스트 케이스를 설계하는 방법.

- 설계된 절차에 초점을 둔 **구조적 테스트**로, **프로시저 설계의 제어 구조를 사용**해 테스트 케이스를 설계.
- 테스트 과정의 **초기에 적용**됨.
- 모듈 안의 작동을 **직접 관찰**.

### 화이트박스 테스트의 종류 ⭐⭐

| 종류 | 설명 |
|---|---|
| **기초 경로 검사**<br>(Base Path Testing) | **대표적인 화이트박스 테스트 기법**. 테스트 측정 결과는 실행 경로의 기초를 정의하는 데 지침으로 사용됨 |
| **제어 구조 검사**<br>(Control Structure Testing) | – |
| ├ **조건 검사**(Condition Testing) | 프로그램 모듈 내에 있는 **논리적 조건**을 테스트 |
| ├ **루프 검사**(Loop Testing) | 프로그램의 **반복(Loop) 구조**에 초점을 맞춰 실시 |
| └ **데이터 흐름 검사**(Data Flow Testing) | 프로그램에서 **변수의 정의와 사용의 위치**에 초점을 맞춰 실시 |

### 화이트박스 테스트의 검증 기준 ⭐⭐⭐

| 검증 기준 | 의미 |
|---|---|
| **문장 검증 기준**<br>(Statement Coverage) | 소스 코드의 **모든 구문이 한 번 이상 수행**되도록 테스트 케이스를 설계 |
| **분기 검증 기준**<br>(Branch Coverage) | 소스 코드의 **모든 조건문에 대해 조건식의 결과가 True 인 경우와 False 인 경우가 한 번 이상 수행**되도록 설계.<br>**결정 검증 기준(Decision Coverage)** 이라고도 함 |
| **조건 검증 기준**<br>(Condition Coverage) | 소스 코드의 조건문에 포함된 **개별 조건식의 결과가 True 와 False 인 경우가 한 번 이상 수행**되도록 설계 |
| **분기/조건 기준**<br>(Branch/Condition Coverage) | **분기 검증 기준과 조건 검증 기준을 모두 만족**하도록 설계 |

> ⚠️ **분기(결정)와 조건의 차이**
> - **분기**는 조건문 **전체의 결과**(if 문 한 덩어리)가 T/F 를 모두 갖도록 함
> - **조건**은 조건문 안의 **개별 조건식 각각**이 T/F 를 모두 갖도록 함

**검증 기준의 강도** — 문장 < 분기 < 분기/조건 < 변경 조건/결정(MC/DC) < 다중 조건

### 테스트 커버리지

주어진 테스트 케이스에 의해 **수행되는 소프트웨어의 테스트 범위를 측정하는 척도**.

| 종류 | 설명 |
|---|---|
| **기능 기반 커버리지** | 테스트 대상 애플리케이션의 **전체 기능을 모수**로 설정. 100% 달성을 목표로 함 |
| **라인 커버리지** | 애플리케이션 전체 소스 코드의 **라인 수를 모수**로 설정 |
| **코드 커버리지** | 소스 코드의 **구문, 조건, 결정** 등의 구조 코드 자체가 얼마나 테스트되었는지를 측정 |
