## (2) 애플리케이션 테스트의 기본 원리 ⭐⭐

| 원리 | 의미 |
|---|---|
| **완벽한 테스트 불가능** | 소프트웨어의 잠재적인 결함을 줄일 수는 있지만 **결함이 없다고 증명할 수는 없음** |
| **파레토 법칙**<br>(Pareto Principle) | 애플리케이션의 **20% 에 해당하는 코드에서 전체 결함의 80% 가 발견**된다는 법칙 |
| **살충제 패러독스**<br>(Pesticide Paradox) | **동일한 테스트 케이스로 반복 실행하면 더 이상 새로운 결함을 발견할 수 없음**.<br>→ 테스트 케이스를 **정기적으로 검토·개선**해야 함 |
| **테스팅은 정황(Context) 의존** | 소프트웨어의 **특징, 테스트 환경, 테스터 역량 등 정황에 따라** 테스트 결과가 달라짐 |
| **오류-부재의 궤변**<br>(Absence of Errors Fallacy) | 결함을 모두 제거해도 **사용자의 요구사항을 만족시키지 못하면** 품질이 높다고 볼 수 없음 |
| **테스트와 위험은 반비례** | 테스트를 많이 하면 할수록 **위험은 줄어듦** |
| **테스트의 점진적 확대** | 테스트는 **작은 부분에서 시작해 점점 확대**하며 진행해야 함 |
| **테스트의 별도 팀 수행** | 개발자와 **별개의 팀**에서 수행해야 **결함 발견율이 높아짐** |

> 📌 가장 자주 나오는 둘 — **파레토 법칙(20% / 80%)** 과 **살충제 패러독스**.
