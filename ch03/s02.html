## (2) 연계 요구사항 분석

### 연계 요구사항 분석

통합 구현을 위해 **연계 시스템과 관련된 요구사항을 분석**하는 작업.

### 분석 기법 ★

| 기법 | 내용 |
|---|---|
| **인터뷰** | 사용자와의 면담을 통해 요구사항을 도출 |
| **체크리스트** | 시스템 운영 환경, 성능, 보안, 데이터 발생 주기 등을 **점검표**로 분석 |
| **설문지·설문 조사** | 다수의 이해관계자에게서 요구사항을 수집 |
| **델파이 기법** | **전문가의 경험적 지식**을 통해 문제를 해결하고 미래를 예측 |
| **브레인스토밍** | 3인 이상이 자유롭게 의견을 제시해 요구사항을 도출 |
| **워크숍** | 관련자들이 모여 짧은 시간에 집중적으로 요구사항을 도출 |

### 요구사항 분석 절차

```mermaid
flowchart LR
    A[연계 시스템 및 데이터 식별] --> B[요구사항 도출] --> C[요구사항 분석] --> D[요구사항 명세] --> E[요구사항 검증]
```

### 연계 요구사항 분석 시 참고 문서

- **개체 정의서** : 개체(Entity)의 명칭·정의·속성 등을 기술한 문서
- **테이블 정의서** : 테이블의 컬럼, 데이터 타입, 제약 조건을 기술한 문서
- **코드 정의서** : 코드의 종류와 값을 정의한 문서
- **응용 프로그램 관련 문서** : 화면 설계서, 인터페이스 설계서 등
