## (8) SOAP과 WSDL

### SOAP(Simple Object Access Protocol) ★

컴퓨터 네트워크상에서 **웹 서비스를 이용해 XML 기반의 메시지를 교환**하는 프로토콜.

- **HTTP, HTTPS, SMTP** 등을 이용해 전송.
- 최근에는 **SOAP 대신 REST 방식**을 이용하기도 함.
- 구조 : **Envelope(봉투) → Header(헤더) → Body(본문)**

### WSDL(Web Services Description Language) ★

**웹 서비스와 관련된 정보를 XML 형식으로 기술**한 언어.

- 웹 서비스의 **이름, 제공 위치, 메시지 포맷, 프로토콜 정보** 등을 기술.
- **UDDI** 의 기초가 됨.
- SOAP, XML 스키마와 결합해 웹 서비스를 제공.

### UDDI(Universal Description, Discovery and Integration)

**WSDL 을 등록해 놓고 검색할 수 있게 한 저장소**.
웹 서비스를 **등록·검색·통합**하기 위한 규격.

```mermaid
flowchart LR
    P["서비스 제공자<br/>(Provider)"] -->|"① WSDL 등록"| U[("UDDI<br/>레지스트리")]
    R["서비스 요청자<br/>(Requester)"] -->|"② 검색"| U
    U -->|"③ WSDL 반환"| R
    R -->|"④ SOAP 호출"| P
```

> 📌 **웹 서비스 3요소** — **SOAP**(메시지 교환) · **WSDL**(서비스 기술) · **UDDI**(등록·검색)

### REST(Representational State Transfer)

**HTTP URI 로 자원을 명시**하고, **HTTP 메서드(GET, POST, PUT, DELETE)** 로
해당 자원에 대한 처리를 요청하는 아키텍처.

| 비교 | SOAP | REST |
|---|---|---|
| 형식 | **XML 만** 사용 | XML, **JSON**, HTML 등 다양 |
| 무거움 | 상대적으로 **무거움** | **가벼움** |
| 표준 | 엄격한 표준 규격 | 아키텍처 스타일(느슨함) |
| 상태 | 상태 유지 가능 | **무상태(Stateless)** |
