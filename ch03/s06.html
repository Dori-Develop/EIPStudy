## (6) 연계 데이터 보안

### 연계 데이터 보안

연계 데이터는 **개인정보나 업무상 민감 정보**를 포함할 수 있으므로,
**전송 구간**과 **데이터 자체**에 대해 보안을 적용해야 함.

```mermaid
flowchart TD
    A[연계 데이터 보안] --> B["전송 구간 보안<br/>(통신 경로를 보호)"]
    A --> C["데이터 보안<br/>(데이터 자체를 암호화)"]
```

### 전송 구간 보안

송·수신 시스템 사이의 **네트워크 경로 자체를 보호**하는 방식.

| 기술 | 설명 |
|---|---|
| **VPN**(Virtual Private Network) | 공중망에 **터널을 만들어** 전용선처럼 사용하는 가상 사설 통신망 |
| **SSL / TLS** | 전송 계층에서 데이터를 암호화해 주고받는 프로토콜. **HTTPS** 가 대표적 |
| **IPSec** | **네트워크 계층**에서 IP 패킷을 암호화·인증하는 프로토콜 |

### 데이터 보안

연계 데이터 **자체를 암호화**해 전송하는 방식.
송신 시스템에서 **암호화**하고 수신 시스템에서 **복호화**.

**암·복호화 적용 절차** ★

```mermaid
flowchart LR
    A[데이터 암호화 대상 선정] --> B[암호화 알고리즘 및 키 선정] --> C[송신 시스템 암호화 적용] --> D[수신 시스템 복호화 적용] --> E[검증]
```

| 단계 | 내용 |
|---|---|
| **암호화 대상 선정** | 연계 데이터 중 **개인정보·민감정보 항목**을 골라냄 |
| **알고리즘 및 키 선정** | 대칭키(AES, SEED, ARIA) 또는 비대칭키(RSA) 중 선택 |
| **송신 시스템 암호화** | 데이터 생성·추출 후 전송 전에 암호화 |
| **수신 시스템 복호화** | 데이터 수신 후 운영 DB 에 반영하기 전에 복호화 |
| **검증** | 암·복호화 결과가 원본과 일치하는지 확인 |

> ⚠️ **개인정보는 반드시 암호화 대상**. 주민등록번호·계좌번호·비밀번호 등이 해당됨.
