## (9) 연계 테스트

### 연계 테스트

구축된 연계 시스템과 연계 시스템의 **구성 요소가 정상적으로 동작하는지 확인**하는 활동.

### 연계 테스트 절차 ★

```mermaid
flowchart LR
    A[연계 테스트 케이스 작성] --> B[연계 테스트 환경 구축] --> C[연계 테스트 수행] --> D[연계 테스트 수행 결과 검증]
```

| 단계 | 내용 |
|---|---|
| **연계 테스트 케이스 작성** | 연계 테스트 항목을 **송·수신 시스템별로 도출**해 케이스로 만듦 |
| **연계 테스트 환경 구축** | 테스트 일정·절차·방법을 협의하고 **테스트 환경을 준비** |
| **연계 테스트 수행** | 송·수신 시스템의 **연계 프로그램을 실행**해 테스트를 진행 |
| **연계 테스트 수행 결과 검증** | 연계 **데이터의 정합성과 오류 처리**가 정상인지 확인 |

### 검증 방법

| 방법 | 내용 |
|---|---|
| **운영 DB 데이터 조회** | 수신 시스템의 운영 DB 에 데이터가 정확히 반영됐는지 확인 |
| **파일 생성 위치 확인** | 연계 파일이 지정된 위치에 정상 생성됐는지 확인 |
| **연계 서버 로그 확인** | 송수신 및 오류 처리 로그를 확인 |
| **모니터링 화면 확인** | 연계 현황 모니터링 화면에서 성공·실패 건수를 확인 |
