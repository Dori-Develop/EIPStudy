## (1) 통합 구현의 개요

### 통합 구현(Integrated Implementation)

사용자의 요구사항에 맞춰 송·수신 모듈과 중계 모듈 간의 데이터 관계를 분석하고,
이를 기반으로 **연계 방법과 절차를 설계·구현**하는 과정.

- 시스템과 환경, 사용자 요구사항에 따라 구축 방법이 다양하므로 **정해진 표준은 없음**.
- 일반적으로 **송신 시스템, 수신 시스템, 중계 시스템, 연계 데이터, 네트워크**로 구성됨.

### 통합 구현의 구성 요소

```mermaid
flowchart LR
    A["송신 시스템<br/>(연계 데이터 생성·추출)"] --> M["중계 시스템<br/>(변환·매핑·중계)"]
    M --> B["수신 시스템<br/>(수신 데이터 반영)"]
    A -. 네트워크 .- M
    M -. 네트워크 .- B
```

| 구성 요소 | 역할 |
|---|---|
| **송신 시스템** | 연계할 데이터를 **DB 와 애플리케이션으로부터 추출·변환**해 전송함 |
| **수신 시스템** | 송신된 데이터를 **수신 시스템의 형식에 맞게 변환해 반영**함 |
| **중계 시스템** | 송신 시스템과 수신 시스템 **사이에서 데이터를 중계**. 내·외부 시스템 간 통합 시 사용 |
| **연계 데이터** | 송·수신 시스템 간에 **주고받는 데이터**. 속성, 길이, 타입 등이 표준화되어야 함 |
| **네트워크** | 송신·수신·중계 시스템을 **연결하는 통신 환경** |

> 💡 **중계 시스템은 필수가 아님.** 내부 시스템끼리 직접 연계하면 없어도 되고,
> 외부 시스템과 연계하거나 보안·변환이 필요할 때 둠.
