## (3) 연계 데이터 식별 및 표준화

### 절차

```mermaid
flowchart LR
    A[연계 범위 및 항목 정의] --> B[연계 코드 변환 및 매핑] --> C[연계 데이터 식별자와 변경 구분 추가] --> D[연계 데이터 표현 방법 정의] --> E[연계 정의서 및 명세서 작성]
```

| 단계 | 내용 |
|---|---|
| **연계 범위 및 항목 정의** | 시스템 간 연계할 **데이터의 범위와 항목**을 정의함 |
| **연계 코드 변환 및 매핑** | 서로 다른 코드 체계를 **일치시키는 작업**. 코드 매핑 테이블을 활용 |
| **연계 데이터 식별자와 변경 구분 추가** | 데이터를 **식별할 수 있는 키**와, 등록·수정·삭제를 나타내는 **변경 구분**을 추가 |
| **연계 데이터 표현 방법 정의** | 데이터를 **어떤 형식으로 표현할지** 정의 (태그, 구분자, 고정 길이 등) |
| **연계 정의서 및 명세서 작성** | 최종 결과를 문서로 정리 |

### 코드 변환 방식

| 방식 | 설명 |
|---|---|
| **코드 매핑 방식** | 송신 시스템의 코드를 **수신 시스템의 코드로 매핑 테이블을 통해 변환** |
| **코드 변환 방식** | 송·수신 시스템의 코드를 **표준 코드로 각각 변환** |

### 연계 데이터 표현 방법

| 방법 | 설명 |
|---|---|
| **태그 방식** | **XML** 처럼 태그로 데이터를 구분 |
| **구분자 방식** | 콤마(,), 콜론(:), 파이프(\|) 등 **구분자**로 항목을 나눔 |
| **고정 길이 방식** | 각 항목의 **길이를 고정**해 자릿수로 구분 |

### 연계 정의서와 명세서

| 문서 | 내용 |
|---|---|
| **연계 정의서** | 연계 **업무, 대상 시스템, 주기, 방식, 담당자** 등 개괄적 정보 |
| **연계 명세서** | 연계 데이터의 **항목별 상세 정보**(항목명, 타입, 길이, 코드 등) |
