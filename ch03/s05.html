## (5) 연계 장애 및 오류 처리

### 장애 및 오류의 정의

연계 과정에서 발생할 수 있는 **비정상적인 상황**을 정의하고,
**유형별 대응 방안**을 마련해 두는 것.

### 구간별 모니터링 현황 ⭐

| 구간 | 장애 및 오류 모니터링 방법 |
|---|---|
| **송신 시스템** | 연계 데이터 **생성 및 추출** 시 발생한 오류를 **로그 테이블·파일**로 확인 |
| **연계 서버** | 데이터 **송수신 및 오류 처리** 내역을 **연계 서버 로그**로 확인 |
| **수신 시스템** | 수신한 데이터를 **운영 DB 에 반영**할 때 발생한 오류를 로그로 확인 |

### 장애 및 오류 유형 ⭐

| 유형 | 발생 원인 |
|---|---|
| **연계 시스템 오류** | 연계 서버의 **실행·중지·모니터링 기능** 자체의 문제, 서버 다운, 네트워크 장애 |
| **연계 데이터 오류** | 연계 데이터 값이 **유효하지 않음**(길이 초과, 타입 불일치, 필수값 누락 등) |
| **응용 애플리케이션 오류** | 데이터 **생성·추출·반영 로직**의 오류, 데이터 정합성 오류 |

### 장애 및 오류 처리 절차 ⭐

```mermaid
flowchart LR
    A[장애 및 오류 발생] --> B[로그·모니터링으로 인지] --> C[원인 분석] --> D[처리 방안 수립] --> E[조치 및 결과 등록] --> F[재발 방지 대책]
```

### 장애 및 오류 확인 방법

| 방법 | 설명 |
|---|---|
| **로그 테이블·파일 확인** | 인터페이스 테이블이나 로그 파일의 **오류 코드와 메시지**를 확인 |
| **모니터링 현황 확인** | 연계 서버가 제공하는 **모니터링 화면**에서 상태를 확인 |
| **알림 확인** | 오류 발생 시 **메일·SMS 등으로 통보**되는 알림을 확인 |

### 장애 및 오류 기록 항목

- 오류 **코드**와 **메시지**
- 발생 **일시**와 **구간**
- 연계 **데이터 식별자**
- 처리 **상태**와 **담당자**
