## 📌 부록 — 핵심 암기 요약

| 구분 | 암기 포인트 |
|---|---|
| **통합 구현 구성 요소** | 송신 시스템 · 수신 시스템 · **중계 시스템(선택)** · 연계 데이터 · 네트워크 |
| **연계 데이터 식별 절차** | 범위·항목 정의 → 코드 변환·매핑 → 식별자·변경구분 추가 → 표현 방법 정의 → 정의서·명세서 작성 |
| **데이터 표현 방법** | 태그 방식(XML) · 구분자 방식 · 고정 길이 방식 |
| **직접 연계 방식** | **DB Link · DB Connection · JDBC · API/Open API · 하이퍼링크** |
| **간접 연계 방식** | **EAI · ESB · 소켓 · 웹 서비스** |
| **EAI 구축 유형** | **Point-to-Point · Hub & Spoke · Message Bus · Hybrid** |
| **EAI vs ESB** | EAI = **애플리케이션 중심**, ESB = **서비스 중심(느슨한 결합)** |
| **오류 유형** | 연계 시스템 오류 · 연계 데이터 오류 · 응용 애플리케이션 오류 |
| **전송 구간 보안** | **VPN · SSL/TLS · IPSec** |
| **암·복호화 절차** | 대상 선정 → 알고리즘·키 선정 → 송신 암호화 → 수신 복호화 → 검증 |
| **XML** | W3C 표준. **태그 직접 정의**, 대소문자 구분, 루트 하나, 속성값 따옴표 |
| **웹 서비스 3요소** | **SOAP**(메시지) · **WSDL**(기술) · **UDDI**(등록·검색) |
| **SOAP 구조** | **Envelope → Header → Body** |
| **REST** | HTTP URI 로 자원 명시 + HTTP 메서드로 처리. **무상태**, JSON 사용 |
| **연계 테스트 절차** | 케이스 작성 → 환경 구축 → 수행 → 결과 검증 |
