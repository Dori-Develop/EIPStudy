<!doctype html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="description" content="실제 출제 비율로 뽑은 모의 문제지 — 정보처리기사 실기 학습 사이트">
<title>모의 문제지 · EIP Study</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📘</text></svg>">
<link rel="stylesheet" href="assets/style.css">
<script>
/* 첫 페인트 전에 테마를 적용해 깜빡임 방지 */
(function(){try{var t=JSON.parse(localStorage.getItem('eip.theme'));
if(!t)t=matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';
document.documentElement.setAttribute('data-theme',t);}catch(e){}})();
</script>
</head>
<body>

<header class="hdr">
  <!-- 헤더가 fixed 라 복기 40문항 중간에서도 「뒤로」가 늘 보인다.
       라벨과 동작은 exam.js 가 화면에 맞춰 바꾼다 (setBack). -->
  <div class="hdr__title" style="padding-left:8px">
    <a href="index.html" class="js-back js-exam-back">← 홈</a>
    <small class="js-where js-exam-where">모의 문제지 생성</small>
  </div>
  <span class="hdr__brand">정보처리기사 실기</span>
  <button type="button" class="iconbtn js-theme" aria-label="테마 전환">🌙</button>
</header>

<div class="layout">
  <main class="main">
    <div class="wrap">

      <!-- 제목과 설명은 화면마다 exam.js 가 바꾼다 (setBack 과 한 벌).
           헤더의 작은 글씨만으로는 지금 어느 화면인지 눈에 잘 안 들어온다. -->
      <section class="hero">
        <h1 class="js-exam-title">모의 문제지 생성</h1>
        <p class="js-exam-desc">
          최근 7회분 기출의 <strong>단원별 출제 비율</strong>을 그대로 재현해 문제를 뽑습니다.
          회차마다 구성이 달라지므로 매번 다른 시험지가 나옵니다.
          틀린 문제는 오답노트에 자동으로 쌓입니다.
        </p>
      </section>

      <div id="exam-setup"></div>
      <div id="exam-sheet" style="display:none"></div>

      <footer class="footer">
        <p>
          기록은 이 브라우저에만 저장됩니다.
        </p>
        <nav class="toolnav js-toolnav" aria-label="다른 학습 도구"></nav>
      </footer>

    </div>
  </main>
</div>

<!-- 🖼️ 그림 문항(`fig`)이 쓴다. 본문 페이지와 같은 버전을 쓸 것 — 설정을 app.js 가 한 벌로 준다 -->
<script src="https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.min.js"></script>
<!-- 🚨 util.js 가 맨 앞이다 — el·has 를 여기서 받는다 (T35) -->
<script src="assets/util.js"></script>
<script src="assets/app.js"></script>
<script src="assets/dialog.js"></script>
<script src="assets/toc.js"></script>
<script src="assets/wrongstore.js"></script>
<script src="assets/memo.js"></script>
<script src="assets/qcard.js"></script>
<script src="assets/concept.js"></script>
<script src="assets/exam.js"></script>
</body>
</html>
