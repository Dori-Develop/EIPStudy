## (6) 환경 변수와 기본 명령어

### 환경 변수(Environment Variable) ⭐

시스템의 속성을 기록한 변수. 시스템의 **기본 정보를 저장**.

| 구분 | 설명 |
|---|---|
| **시스템 환경 변수** | **시스템 전체**에 적용되는 환경 변수. 관리자가 설정 |
| **사용자 환경 변수** | **특정 사용자**에게만 적용되는 환경 변수 |

**Windows 의 주요 환경 변수** — 변수명을 `%` 로 감쌈

| 변수 | 의미 |
|---|---|
| `%PATH%` | 실행 파일을 찾는 경로 |
| `%TEMP%` / `%TMP%` | 임시 파일이 저장되는 폴더 |
| `%SYSTEMROOT%` | 시스템 폴더(보통 `C:\Windows`) |
| `%USERNAME%` | 현재 사용자 이름 |
| `%HOMEPATH%` | 현재 사용자의 홈 경로 |

**UNIX/LINUX 의 주요 환경 변수** — 변수명 앞에 `$` 를 붙임

| 변수 | 의미 |
|---|---|
| `$PATH` | 실행 파일을 찾는 경로 |
| `$HOME` | 사용자의 홈 디렉터리 |
| `$USER` | 사용자 이름 |
| `$SHELL` | 사용자의 기본 쉘 |
| `$PWD` | 현재 작업 디렉터리 |

**환경 변수 확인 명령** — Windows: `set`, UNIX/LINUX: `env`, `printenv`, `set`

### Windows 기본 명령어 ⭐

| 명령어 | 기능 |
|---|---|
| `DIR` | 현재 디렉터리의 **파일 목록**을 표시 |
| `COPY` | 파일을 **복사** |
| `DEL` | 파일을 **삭제** |
| `TYPE` | 파일의 **내용을 표시** |
| `REN` | 파일의 **이름을 변경** |
| `MD` | **디렉터리를 생성** |
| `CD` | 디렉터리를 **이동** |
| `CLS` | 화면을 **지움** |
| `ATTRIB` | 파일의 **속성을 변경** |
| `FIND` | 파일에서 **문자열을 검색** |
| `CHKDSK` | 디스크 상태를 **점검** |
| `FORMAT` | 디스크를 **초기화** |

### UNIX/LINUX 기본 명령어 ⭐⭐

| 명령어 | 기능 |
|---|---|
| `cat` | 파일 내용을 **화면에 표시** |
| `cd` | 디렉터리 **이동** |
| `chmod` | 파일의 **보호 모드(권한)를 설정** |
| `chown` | 파일의 **소유자를 변경** |
| `cp` | 파일을 **복사** |
| `rm` | 파일을 **삭제** |
| `mv` | 파일을 **이동**하거나 이름을 변경 |
| `ls` | 현재 디렉터리의 **파일 목록**을 표시 |
| `mkdir` / `rmdir` | 디렉터리 **생성 / 삭제** |
| `ps` | 현재 실행 중인 **프로세스를 표시** |
| `kill` | **프로세스를 종료** |
| `fork` | **새로운 프로세스를 생성**(하위 프로세스 호출) |
| `exec` | 새로운 프로세스를 **수행** |
| `wait` | 자식 프로세스가 종료될 때까지 **대기** |
| `pwd` | 현재 **작업 디렉터리를 표시** |
| `find` | 파일을 **검색** |
| `grep` | 파일 내에서 **문자열을 검색** |
| `who` | 현재 **접속한 사용자를 표시** |
| `uname` | **시스템 정보**를 표시 |

**chmod 의 권한 표기** ⭐⭐

권한은 **소유자(User) · 그룹(Group) · 기타(Other)** 순으로 3자리 8진수로 표기.

| 권한 | 값 |
|---|---|
| **읽기**(Read, r) | **4** |
| **쓰기**(Write, w) | **2** |
| **실행**(eXecute, x) | **1** |

> **예제** : `chmod 755 test.txt`
> - 소유자 : 7 = 4+2+1 = **읽기·쓰기·실행(rwx)**
> - 그룹 : 5 = 4+1 = **읽기·실행(r-x)**
> - 기타 : 5 = 4+1 = **읽기·실행(r-x)**
