## (12) 보안 및 API

### 서버 프로그램 보안 취약점 ★

| 취약점 | 설명 |
|---|---|
| **SQL 삽입**(SQL Injection) | 웹 응용 프로그램에 **SQL 을 삽입해 내부 DB 서버의 데이터를 유출·변조**하거나 관리자 인증을 우회 |
| **크로스사이트 스크립팅**(XSS) | 웹 페이지에 **악의적인 스크립트를 삽입**해 방문자들의 정보를 탈취하거나 비정상적인 기능을 수행 |
| **크로스사이트 요청 위조**(CSRF) | 사용자가 **자신의 의지와 무관하게** 공격자가 의도한 행위를 웹사이트에 요청하게 함 |
| **메모리 버퍼 오버플로** | 연속된 메모리 공간을 사용하는 프로그램에서 **할당된 메모리의 범위를 넘어선 위치에 자료를 읽거나 쓰는** 취약점 |
| **보안 기능 관련 취약점** | 인증, 접근 제어, 기밀성, 암호화 등을 **부적절하게 구현**한 경우 |

### API(Application Programming Interface)

응용 프로그램 개발 시 **운영체제나 프로그래밍 언어 등에 있는 라이브러리를 이용할 수 있도록**
규칙 등을 정의해 놓은 인터페이스.

| 종류 | 설명 |
|---|---|
| **Open API** | **누구나 무료로 사용**할 수 있게 공개된 API |
| **Private API** | 기업 **내부에서만** 사용하는 API |
