## (4) 객체 지향(Object-Oriented)

### 객체 지향

현실 세계의 개체(Entity)를 기계의 부품처럼 **하나의 객체(Object)로 만들어**,
부품을 조립하듯 객체들을 조립해서 소프트웨어를 구현하는 기법.

### 구성 요소 ⭐⭐

| 요소 | 설명 |
|---|---|
| **객체**(Object) | **데이터(속성)와 이를 처리하는 함수(메소드)를 묶어 놓은** 소프트웨어 모듈 |
| **클래스**(Class) | **공통된 속성과 연산을 갖는 객체의 집합**. 객체의 **타입(Type)** |
| **메시지**(Message) | 객체 간 **상호작용에 사용되는 수단**. 객체에게 어떤 행위를 하도록 지시하는 **명령 또는 요구** |

| 용어 | 의미 |
|---|---|
| **인스턴스**(Instance) | 클래스로부터 **실제로 만들어진 객체** |
| **속성**(Attribute) | 객체가 갖는 **데이터** |
| **메소드**(Method) | 객체가 수행하는 **동작(함수)** |

### 객체 지향의 기본 원칙 ⭐⭐

| 원칙 | 설명 |
|---|---|
| **캡슐화**<br>(Encapsulation) | 데이터와 데이터를 처리하는 **함수를 하나로 묶는 것**. 재사용이 용이하고, 인터페이스가 단순해지며, **객체 간 결합도가 낮아짐** |
| **정보 은닉**<br>(Information Hiding) | 캡슐화된 항목을 **외부에서 접근하지 못하도록 숨기는 것** |
| **추상화**<br>(Abstraction) | 불필요한 부분을 생략하고 **가장 중요한 것에 중점**을 두어 개략화하는 것 |
| **상속성**<br>(Inheritance) | **상위 클래스의 속성과 연산을 하위 클래스가 물려받는 것** |
| **다형성**<br>(Polymorphism) | **하나의 메시지에 대해 각 객체가 고유한 방법으로 응답**할 수 있는 능력 |

**다형성의 종류**

| 종류 | 설명 |
|---|---|
| **오버로딩**(Overloading) | **같은 이름의 메소드**를 매개변수의 개수나 타입을 달리해 여러 개 정의 |
| **오버라이딩**(Overriding) | **상위 클래스의 메소드를 하위 클래스에서 재정의** |

### 객체 지향 설계 원칙(SOLID) ⭐⭐

| 원칙 | 의미 |
|---|---|
| **단일 책임 원칙**<br>(SRP; Single Responsibility Principle) | 객체는 **단 하나의 책임**만 가져야 함 |
| **개방-폐쇄 원칙**<br>(OCP; Open-Closed Principle) | 기존 코드를 변경하지 않고 기능을 **확장할 수 있어야** 함. **확장에는 열려 있고 변경에는 닫혀 있어야** 함 |
| **리스코프 치환 원칙**<br>(LSP; Liskov Substitution Principle) | **하위 타입은 상위 타입을 대체할 수 있어야** 함 |
| **인터페이스 분리 원칙**<br>(ISP; Interface Segregation Principle) | 자신이 **사용하지 않는 인터페이스에 영향을 받지 않아야** 함 |
| **의존 역전 원칙**<br>(DIP; Dependency Inversion Principle) | 구체적인 것이 아니라 **추상화된 것에 의존**해야 함 |

> 📌 암기: **SOLID** — **S**RP, **O**CP, **L**SP, **I**SP, **D**IP
