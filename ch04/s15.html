## 📌 부록 — 핵심 암기 요약

| 구분 | 암기 포인트 |
|---|---|
| **개발 언어 선정 기준 5가지** | **적효이친범** (적정성·효율성·이식성·친밀성·범용성) |
| **아키텍처 설계 원리 4가지** | **모듈화 · 추상화 · 단계적 분해 · 정보 은닉** |
| **추상화 유형 3가지** | 과정 · 데이터 · 제어 |
| **협약에 의한 설계 3조건** | 선행 조건 · 결과 조건 · 불변 조건 |
| **아키텍처 패턴 10가지** | 레이어(OSI) · 클라이언트-서버 · **파이프-필터(UNIX 쉘)** · **MVC** · 마스터-슬레이브 · 브로커 · 피어투피어 · 이벤트버스 · 블랙보드 · 인터프리터 |
| **객체 지향 구성 요소 3가지** | **객체 · 클래스 · 메시지** |
| **객체 지향 5원칙** | 캡슐화 · 정보 은닉 · 추상화 · 상속성 · 다형성 |
| **다형성 종류 2가지** | **오버로딩**(같은 이름·다른 매개변수) / **오버라이딩**(재정의) |
| **객체 지향 설계 원칙 SOLID 5가지** | **SRP**(단일 책임) · **OCP**(개방-폐쇄) · **LSP**(리스코프 치환) · **ISP**(인터페이스 분리) · **DIP**(의존 역전) |
| **객체 지향 분석 방법론 5가지** | **럼바우(OMT)** · 부치(미시·거시) · **Jacobson(유스케이스)** · Coad&Yourdon(ERD) · Wirfs-Brock |
| **럼바우 분석 절차** | **객동기** — 객체(객체 다이어그램) → 동적(상태 다이어그램) → 기능(**DFD**) |
| **결합도(약→강)** | **자스제외공내** (자료·스탬프·제어·외부·공통·내용) |
| **응집도(강→약)** | **기순교절시논우** (기능·순차·교환·절차·시간·논리·우연) |
| **좋은 설계** | 결합도 **낮게**, 응집도 **높게**, 팬인 **높게**, 팬아웃 **낮게** |
| **IPC(프로세스 간 통신) 기법 5가지** | 공유 메모리 · 소켓 · 세마포어 · 파이프 · 메시지 큐 |
| **공통 모듈 명세 원칙 5가지** | **정명완일추** (정확성·명확성·완전성·일관성·추적성) |
| **코드 종류 7가지** | 순차 · 블록 · 10진 · 그룹 분류 · **연상** · **표의 숫자** · 합성 |
| **GoF 분류** | **생성 5 · 구조 7 · 행위 11 = 23** |
| **생성 패턴 5** | 추상 팩토리 · 빌더 · 팩토리 메소드 · 프로토타입 · **싱글톤** |
| **구조 패턴 7** | **어댑터** · 브리지 · 컴포지트 · 데코레이터 · **퍼사드** · 플라이웨이트 · **프록시** |
| **행위 패턴 11** | 책임 연쇄 · 커맨드 · 인터프리터 · 반복자 · 중재자 · 메멘토 · **옵서버** · 상태 · **전략** · 템플릿 메소드 · 방문자 |
| **빌드 도구 4가지** | **Ant(XML)** · **Maven(의존성)** · **Gradle(Groovy)** · **Jenkins(CI)** |
| **서버 프레임워크 5가지** | Spring(JAVA) · Node.js(JS) · Django(Python) · Codeigniter(PHP) · Ruby on Rails(Ruby) |
| **서버 개발 보안 취약점 4가지** | **SQL 삽입 · XSS · CSRF · 버퍼 오버플로** |
| **배치 프로그램 필수 요소 5가지** | **대자견안성** (대용량·자동화·견고성·안정성·성능) |
| **배치 스케줄러 3가지** | 스프링 배치 · Quartz · **Cron(리눅스)** |
| **Cron 표현식 순서** | **분 시 일 월 요일** |
