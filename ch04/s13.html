## (13) 배치 프로그램

### 배치 프로그램(Batch Program)

사용자와의 상호 작용 없이 **여러 작업들을 미리 정해진 일련의 순서에 따라 일괄적으로 처리**하는 것.

### 배치 프로그램의 필수 요소 ⭐⭐

| 요소 | 의미 |
|---|---|
| **대용량 데이터** | 대용량의 데이터를 **처리할 수 있어야** 함 |
| **자동화** | 심각한 오류가 발생하는 상황을 제외하고는 **사용자의 개입 없이 수행**되어야 함 |
| **견고성** | 잘못된 데이터나 데이터 중복 등으로 인해 **중단되는 일 없이 수행**되어야 함 |
| **안정성 / 신뢰성** | 오류가 발생하면 **오류의 발생 위치, 시간 등을 추적**할 수 있어야 함 |
| **성능** | 지정된 시간 내에 처리가 완료되어야 하며, **다른 응용 프로그램의 수행을 방해하지 않아야** 함 |

> 📌 암기: **"대자견안성"**

### 배치 스케줄러(Batch Scheduler)

일괄 처리(Batch Processing) 작업이 **설정된 주기에 맞춰 자동으로 수행되도록** 지원해 주는 도구.

| 종류 | 설명 |
|---|---|
| **스프링 배치**(Spring Batch) | **Spring Source 사와 Accenture 사**가 공동 개발한 오픈 소스 프레임워크. 로그 관리, 추적, 트랜잭션 관리 등을 제공 |
| **Quartz** | **스프링 프레임워크로 개발되는 응용 프로그램들의 일괄 처리**를 위한 오픈 소스 라이브러리 |
| **Cron** | **리눅스의 기본 스케줄러 도구**. `crontab` 명령어로 작업을 예약 |

### Cron 표현식 ⭐

```
*     *     *     *     *
분    시    일    월    요일
(0-59)(0-23)(1-31)(1-12)(0-7, 0·7=일요일)
```

| 표현식 | 의미 |
|---|---|
| `0 3 * * *` | 매일 **새벽 3시 정각**에 실행 |
| `*/10 * * * *` | **10분마다** 실행 |
| `0 0 1 * *` | 매월 **1일 자정**에 실행 |
