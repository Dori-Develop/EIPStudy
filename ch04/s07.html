## (7) 단위 모듈과 공통 모듈

### 단위 모듈(Unit Module)

소프트웨어 구현에 필요한 **여러 동작 중 하나의 기능을 수행**하는 모듈.

- 사용자나 다른 모듈로부터 **값을 전달받아 시작되는 작은 프로그램**을 의미.
- 두 개의 단위 모듈을 합치면 **두 개의 기능을 구현**할 수 있음.
- 단위 모듈의 구현 과정 : **단위 기능 명세서 작성 → 입·출력 기능 구현 → 알고리즘 구현**

### IPC(Inter-Process Communication) ⭐

모듈 간 **통신 방식을 구현**하기 위해 사용되는 **프로세스 간 통신 방법**.

| 방식 | 설명 |
|---|---|
| **공유 메모리**(Shared Memory) | 다수의 프로세스가 **공유 가능한 메모리를 구성**해 통신 |
| **소켓**(Socket) | **네트워크 소켓**을 이용해 프로세스 간 통신 |
| **세마포어**(Semaphores) | **공유 자원에 대한 접근을 제어**해 동기화 |
| **파이프와 명명 파이프**(Pipes & Named Pipes) | 한 프로세스가 **파이프를 생성**하고 다른 프로세스와 통신 |
| **메시지 큐**(Message Queueing) | **메시지가 발생하면 큐를 통해** 다른 프로세스에 전달 |

### 공통 모듈

여러 프로그램에서 **공통으로 사용할 수 있는 모듈**.

**공통 모듈 명세 기법(작성 원칙)** ⭐⭐

| 원칙 | 의미 |
|---|---|
| **정확성**(Correctness) | 시스템 구현 시 해당 기능이 **필요하다는 것을 정확히** 알 수 있도록 작성 |
| **명확성**(Clarity) | 해당 기능을 **일관되게 이해**하고 하나로 해석될 수 있도록 작성 |
| **완전성**(Completeness) | 시스템 구현을 위해 **필요한 모든 것을 기술** |
| **일관성**(Consistency) | 공통 기능 간에 **서로 충돌이 발생하지 않도록** 작성 |
| **추적성**(Traceability) | 기능에 대한 **요구사항의 출처, 관련 시스템 등의 관계를 파악**할 수 있도록 작성 |

> 📌 암기: **"정명완일추"**

### 재사용(Reuse)

비용과 개발 시간을 절약하기 위해 **이미 개발된 기능들을 파악하고 재구성**해
새로운 시스템 또는 기능 개발에 사용하기 적합하도록 최적화하는 작업.

| 재사용 규모 | 설명 |
|---|---|
| **함수와 객체** | **클래스나 함수** 단위로 구현한 소스 코드를 재사용 |
| **컴포넌트** | **컴포넌트 자체를 수정하지 않고** 인터페이스를 통해 재사용 |
| **애플리케이션** | **공통된 기능을 제공하는 애플리케이션**을 공유해 재사용 |
