## (2) 소프트웨어 아키텍처

### 소프트웨어 아키텍처(Software Architecture)

소프트웨어의 **골격이 되는 기본 구조**이자,
소프트웨어를 구성하는 요소들 사이의 **관계를 표현하는 시스템의 구조 또는 구조체**.

- 개발자와 이해관계자 사이의 **의사소통 도구**가 됨.
- 시스템의 품질 요구사항을 만족시키는 데 결정적 역할을 함.

### 소프트웨어 아키텍처 설계의 기본 원리 ⭐⭐

| 원리 | 의미 |
|---|---|
| **모듈화**<br>(Modularity) | 시스템의 기능들을 **모듈 단위로 나누는 것**. 소프트웨어의 성능 향상, 시스템 수정 및 재사용, 유지 관리를 쉽게 함 |
| **추상화**<br>(Abstraction) | 문제의 **전체적이고 포괄적인 개념을 설계한 후 차례로 세분화**해 구체화하는 것 |
| **단계적 분해**<br>(Stepwise Refinement) | 문제를 상위의 중요 개념부터 하위의 개념으로 **분할하는 하향식 설계 전략** |
| **정보 은닉**<br>(Information Hiding) | 한 모듈 내부에 포함된 절차와 자료들의 정보가 **감추어져 다른 모듈이 접근하거나 변경하지 못하도록** 하는 기법 |

**추상화의 유형**

| 유형 | 설명 |
|---|---|
| **과정 추상화** | 자세한 수행 과정을 정의하지 않고 **전반적인 흐름만** 파악할 수 있게 설계 |
| **데이터 추상화** | 데이터의 **세부적인 속성이나 용도를 정의하지 않고** 데이터 구조를 대표할 수 있는 표현으로 설계 |
| **제어 추상화** | 이벤트 발생의 **정확한 절차나 방법을 정의하지 않고** 대표할 수 있는 표현으로 설계 |

### 소프트웨어 아키텍처의 품질 속성

| 구분 | 속성 |
|---|---|
| **시스템 측면** | 성능, 보안, 가용성, 기능성, 사용성, 변경 용이성, 확장성 |
| **비즈니스 측면** | 시장 적시성, 비용과 혜택, 예상 시스템 수명 |
| **아키텍처 측면** | 개념적 무결성, 정확성, 완결성, 구축 가능성 |

### 협약(Contract)에 의한 설계

컴포넌트를 설계할 때 클래스에 대한 여러 가정을 **공유할 수 있도록 명세**한 것.

| 조건 | 의미 |
|---|---|
| **선행 조건**(Precondition) | 오퍼레이션이 **호출되기 전에 참**이 되어야 할 조건 |
| **결과 조건**(Postcondition) | 오퍼레이션이 **수행된 후 참**이 되어야 할 조건 |
| **불변 조건**(Invariant) | 오퍼레이션이 실행되는 **동안 항상 참**이 되어야 할 조건 |
