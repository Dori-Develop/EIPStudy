## (8) 코드(Code)

### 코드

컴퓨터를 이용해 자료를 처리하는 과정에서 **분류·조합 및 집계를 용이하게 하고**,
특정 자료의 **추출을 쉽게 하기 위해 사용하는 기호**.

**코드의 주요 기능**

- **식별 기능** : 데이터 간의 성격에 따라 구분이 가능함
- **분류 기능** : 특정 기준이나 동일한 성격의 데이터를 그룹화할 수 있음
- **배열 기능** : 의미를 부여해 나열할 수 있음
- **표준화 기능** : 다양한 데이터를 기준에 맞추어 표현할 수 있음
- **간소화 기능** : 복잡한 데이터를 간소화할 수 있음

### 코드의 종류 ⭐⭐

| 코드 | 설명 | 예 |
|---|---|---|
| **순차 코드**<br>(Sequence Code) | 자료의 발생 순서나 크기 순서에 따라 **일련번호를 부여**. **순서 코드, 일련번호 코드**라고도 함 | 1, 2, 3, 4 … |
| **블록 코드**<br>(Block Code) | 공통성 있는 것끼리 **블록으로 구분**하고 각 블록 내에서 일련번호 부여. **구분 코드**라고도 함 | 1001~1100(총무부), 1101~1200(영업부) |
| **10진 코드**<br>(Decimal Code) | 큰 분류부터 시작해 **10진 분할을 반복**. **도서 분류식 코드**라고도 함 | 1000: 공학, 1100: 컴퓨터공학 |
| **그룹 분류 코드**<br>(Group Classification Code) | 대분류·중분류·소분류로 나눈 후 **각 그룹 안에서 일련번호** 부여 | 1-01-001 |
| **연상 코드**<br>(Mnemonic Code) | 명칭이나 규격의 **일부를 코드에 넣어 대상을 쉽게 연상**할 수 있게 함 | TV-40(40인치 TV) |
| **표의 숫자 코드**<br>(Significant Digit Code) | 대상 자료의 **길이, 넓이, 부피, 지름 등 물리적 수치**를 그대로 코드에 적용. **유효 숫자 코드**라고도 함 | 120-70-500(가로-세로-높이) |
| **합성 코드**<br>(Combined Code) | 필요한 **둘 이상의 코드를 조합**해 만듦 | KE-711(연상 + 순차) |
