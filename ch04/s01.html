## (1) 개발 환경 구축

### 개발 환경 구축

응용 소프트웨어 개발을 위해 개발 **하드웨어 및 소프트웨어 환경을 구축**하는 것.

### 하드웨어 환경 ⭐

**클라이언트(Client)** 와 **서버(Server)** 로 구성됨.

| 구분 | 내용 |
|---|---|
| **클라이언트** | 사용자가 직접 접하는 부분. **PC, 스마트폰, 키오스크** 등 |
| **서버** | 클라이언트의 요청을 처리하는 부분 |

**서버의 종류**

| 서버 | 역할 |
|---|---|
| **웹 서버**(Web Server) | **정적 콘텐츠**(HTML, CSS, 이미지)를 처리. HTTP 요청을 받아 응답 |
| **웹 애플리케이션 서버**(WAS) | **동적 콘텐츠**를 처리. DB 조회나 비즈니스 로직 수행 |
| **데이터베이스 서버**(DB Server) | 데이터의 **저장과 관리**를 담당 |
| **파일 서버**(File Server) | 파일 저장 및 공유를 담당 |

### 소프트웨어 환경

| 구분 | 종류 |
|---|---|
| **시스템 소프트웨어** | 운영체제(OS), 웹 서버 및 WAS 운용을 위한 서버 프로그램, DBMS |
| **개발 소프트웨어** | **요구사항 관리 도구, 설계·모델링 도구, 구현 도구, 빌드 도구, 테스트 도구, 형상 관리 도구** |

| 도구 | 예 |
|---|---|
| 요구사항 관리 도구 | JIRA, Redmine |
| 설계·모델링 도구 | StarUML, DBeaver |
| 구현 도구(IDE) | Eclipse, IntelliJ, Visual Studio |
| 빌드 도구 | **Ant, Maven, Gradle, Jenkins** |
| 테스트 도구 | JUnit, Spring Test |
| 형상 관리 도구 | **Git, SVN, CVS** |

### 개발 언어의 선정 기준 ⭐

| 기준 | 의미 |
|---|---|
| **적정성** | 개발하려는 목적에 **적합**해야 함 |
| **효율성** | 코드의 작성 및 구현이 **효율적**이어야 함 |
| **이식성** | 다양한 **환경에 적용**이 가능해야 함 |
| **친밀성** | 개발자가 **이해하고 사용**할 수 있어야 함 |
| **범용성** | 다른 개발 사례가 많고 **여러 분야에서 활용**되어야 함 |

> 📌 암기: **"적효이친범"**
