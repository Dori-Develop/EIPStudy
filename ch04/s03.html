## (3) 아키텍처 패턴

### 아키텍처 패턴(Architecture Pattern)

아키텍처를 설계할 때 참조할 수 있는 **전형적인 해결 방식, 예제**.
**아키텍처 스타일** 또는 **표준 아키텍처**라고도 함.

### 주요 아키텍처 패턴 ★★

| 패턴 | 설명 |
|---|---|
| **레이어 패턴**<br>(Layers Pattern) | 시스템을 계층으로 구분해 구성. 각 하위 모듈은 **특정 수준의 추상화를 제공**하고, 서로 마주보는 두 개의 계층 사이에서만 상호작용. **OSI 참조 모델**이 대표적 |
| **클라이언트-서버 패턴**<br>(Client-Server Pattern) | 하나의 **서버**와 다수의 **클라이언트**로 구성. 사용자는 클라이언트를 통해 서버에 요청하고 응답을 받아 사용자에게 보여 줌 |
| **파이프-필터 패턴**<br>(Pipe-Filter Pattern) | 데이터 스트림 절차의 각 단계를 **필터**로 캡슐화하고 **파이프**를 통해 데이터를 전송. 재사용성이 좋고 유지보수가 쉬움. **UNIX 의 쉘(Shell)** 이 대표적 |
| **모델-뷰-컨트롤러 패턴**<br>(MVC Pattern) | 서브시스템을 **모델·뷰·컨트롤러** 세 부분으로 구조화. 각 부분이 **독립적**이어서 서로 영향을 주지 않음 |
| **마스터-슬레이브 패턴** | **마스터**가 동일한 구조의 **슬레이브**로 작업을 분할한 후 결과를 계산. 주로 **병렬 컴퓨팅** 시스템에서 사용 |
| **브로커 패턴** | 사용자가 요청하면 **브로커 컴포넌트**가 요청에 맞는 컴포넌트와 사용자를 연결. **분산 환경 시스템**에서 사용 |
| **피어-투-피어 패턴** | 각 컴포넌트가 **클라이언트가 될 수도, 서버가 될 수도** 있는 패턴 |
| **이벤트-버스 패턴** | **소스**가 이벤트를 발행하면 해당 채널을 구독한 **리스너**가 이벤트를 받아 처리 |
| **블랙보드 패턴** | 모든 컴포넌트가 **블랙보드(공유 저장소)** 에 접근. **음성 인식, 신호 해석** 등 확실한 해결 전략이 없을 때 유용 |
| **인터프리터 패턴** | 프로그램 코드의 각 라인을 **수행하는 방법을 지정**하고 기호마다 클래스를 갖도록 구성 |

### MVC 패턴 상세 ★

```mermaid
flowchart LR
    U((사용자)) -->|입력| C[Controller<br/>컨트롤러]
    C -->|조작| M[Model<br/>모델]
    M -->|상태 변경 통보| V[View<br/>뷰]
    V -->|화면 출력| U
    C -->|선택| V
```

| 구성 | 역할 |
|---|---|
| **모델**(Model) | 서브시스템의 **핵심 기능과 데이터**를 보관 |
| **뷰**(View) | 사용자에게 **정보를 표시** |
| **컨트롤러**(Controller) | 사용자로부터 받은 **입력을 처리** |
