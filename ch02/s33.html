## 📌 부록 — 핵심 암기 요약

| 구분 | 암기 포인트 |
|---|---|
| **데이터 전환** | **ETL** — 추출(Extraction) → 변환(Transformation) → 적재(Load) |
| **오류 상태** | Open → Assigned → Fixed → Closed / Deferred / Classified |
| **DB 정의** | 통합·저장·운영·공용 데이터 |
| **DB 특징** | 실시간 접근성 · 계속적인 변화 · 동시 공용 · 내용에 의한 참조 |
| **DBMS 필수 기능** | **정의 · 조작 · 제어** |
| **스키마 3층** | 외부(여럿) · **개념(하나)** · 내부 |
| **DB 설계 순서** | 요구 조건 분석 → **개념 → 논리 → 물리** → 구현 |
| **개념적 설계 산출물** | **E-R 다이어그램** |
| **데이터 모델 구성** | **구조 · 연산 · 제약 조건** |
| **논리적 데이터 모델** | 관계형(표) · 계층형(트리, 1:N) · 네트워크형(그래프, N:M) |
| **E-R 기호** | □ 개체 · ◇ 관계 · ○ 속성 · 밑줄 타원 기본키 |
| **릴레이션 용어** | 차수 = **열 개수**, 카디널리티 = **행 개수** |
| **릴레이션 특징** | 튜플 유일성 · 튜플 무순서 · 속성 무순서 · 속성 원자성 |
| **키** | 슈퍼(유일성) → 후보(유일+최소) → 기본(대표) → 대체(나머지) → 외래(참조) |
| **무결성** | **개체=기본키(NULL 불가)**, **참조=외래키**, 도메인, 사용자 정의 |
| **순수 관계 연산자** | **σ Select(행)** · **π Project(열)** · ⋈ Join · ÷ Division |
| **관계대수 vs 해석** | 대수 = **절차적(How)**, 해석 = **비절차적(What)** |
| **이상** | 삽입 · 삭제 · 갱신 |
| **함수 종속** | 완전 · 부분 · 이행적 |
| **정규화** | **두부이걸다조** (도메인원자값·부분제거·이행제거·결정자·다치·조인) |
| **반정규화** | 테이블 통합/분할 · 중복 테이블 추가 · 중복 속성 추가 |
| **시스템 카탈로그** | 데이터 사전. **검색은 가능, 직접 갱신 불가** |
| **트랜잭션 ACID** | **원자성 · 일관성 · 독립성 · 영속성** |
| **CRUD 우선순위** | **C > D > U > R** |
| **인덱스 vs 클러스터** | 인덱스 = 분포도 **좁을 때**, 클러스터 = 분포도 **넓을 때** |
| **뷰** | 가상 테이블. 인덱스 불가, 정의 변경 불가, 기본 테이블 삭제 시 자동 삭제 |
| **파티션** | 범위 · 해시 · 조합 · 목록 · 라운드 로빈 |
| **분산 DB 투명성** | **위중병장** (위치·중복·병행·장애) |
| **DB 이중화** | Eager(즉시) / Lazy(커밋 후) · Active-Standby / Active-Active |
| **접근통제** | **DAC = 신원**, **MAC = 등급**, **RBAC = 역할** |
| **회복 기법** | 지연 갱신(Undo 불필요) · 즉각 갱신 · 검사점 · 그림자 페이징(로그 없음) |
| **REDO / UNDO** | REDO = 완료된 트랜잭션 재실행, UNDO = 미완료 트랜잭션 취소 |
| **스토리지** | DAS(직접) · **NAS(파일 단위)** · **SAN(블록 단위)** |
| **논리→물리 변환** | 개체→테이블, 속성→컬럼, 주식별자→기본키, 외부식별자→외래키 |
| **자료 구조** | 선형(배열·리스트·**스택**·**큐**·데크) / 비선형(**트리**·**그래프**) |
| **스택 / 큐** | 스택 = **LIFO**, 큐 = **FIFO** |
| **트리 운행** | 전위 **DLR** · 중위 **LDR** · 후위 **LRD** |
| **정렬 O(n log n)** | **힙 · 합병** (항상) / **퀵** (평균만, 최악 O(n²)) |
| **해싱 용어** | 버킷 · 슬롯 · 충돌 · 동의어 · 오버플로 |
